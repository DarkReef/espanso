[package]
name = "espanso-package"
version = "0.1.0"
authors = ["Federico Terzi <federico-terzi@users.noreply.github.com>"]
edition = "2021"

[dependencies]
log.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tempdir.workspace = true
glob.workspace = true
natord = "1.0.9"
regex.workspace = true
zip = { version = "0.5.13", default-features = false, features = ["deflate", "bzip2"] }
scopeguard = "1.1.0"
fs_extra.workspace = true
sha2 = "0.9.6"
hex = "0.4.3"
# The newer 0.11.x lock graph can select hyper 0.14.32/socket2 0.5 and
# windows-targets 0.52, whose generated GDI+ stubs conflict with wxWidgets.
reqwest = { version = "=0.11.17", features = [
    "blocking",
], default-features = false }
# Keep the last upstream-tested hyper release that still resolves socket2 0.4.
# This direct pin is intentional even though espanso-package uses it via reqwest.
hyper = "=0.14.26"

# On Linux we don't want to depend on openssl to avoid dependency issues
# https://github.com/espanso/espanso/issues/1056
# We need to use features to control this behavior instead of targets due to this Cargo bug:
# https://github.com/rust-lang/cargo/issues/1197
[features]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[lints]
workspace = true
