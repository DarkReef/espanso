name: Rhai diagnostics

on:
  push:
    branches:
      - dev-in
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "espanso-render/**"
      - ".github/workflows/rhai-diagnostics.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "espanso-render/**"
      - ".github/workflows/rhai-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhai-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Compile embedded Rhai runtime
        id: compile
        shell: bash
        run: |
          set +e
          cargo test -p espanso-render --no-run > rhai-build.log 2>&1
          status=$?
          cat rhai-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full compiler output
        uses: actions/upload-artifact@v4
        with:
          name: rhai-build-log-${{ github.sha }}
          path: rhai-build.log
          retention-days: 7

      - name: Fail when compilation failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
