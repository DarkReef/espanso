name: Rhai diagnostics

on:
  push:
    branches:
      - dev-in
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "espanso-engine/src/process/default.rs"
      - "espanso-render/**"
      - "espanso/src/bin/respanso-portable.rs"
      - "espanso/src/cli/worker/engine/**"
      - "examples/medical-calculators/**"
      - "docs/respanso-medical-calculators.md"
      - ".github/workflows/rhai-diagnostics.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "espanso-engine/src/process/default.rs"
      - "espanso-render/**"
      - "espanso/src/bin/respanso-portable.rs"
      - "espanso/src/cli/worker/engine/**"
      - "examples/medical-calculators/**"
      - "docs/respanso-medical-calculators.md"
      - ".github/workflows/rhai-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhai-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt to rEspanso branch changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          cargo fmt --all
          files=(
            espanso-engine/src/process/default.rs
            espanso-render/src/extension/rhai.rs
            espanso/src/bin/respanso-portable.rs
            espanso/src/cli/worker/engine/dispatch/executor/clipboard_injector.rs
            espanso/src/cli/worker/engine/mod.rs
          )
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style(respanso): apply rustfmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run embedded Rhai runtime and clinical calculator tests
        id: test
        shell: bash
        run: |
          set +e
          cargo test -p espanso-render > rhai-test.log 2>&1
          status=$?
          cat rhai-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full test output
        uses: actions/upload-artifact@v4
        with:
          name: rhai-test-log-${{ github.sha }}
          path: rhai-test.log
          retention-days: 7

      - name: Fail when tests failed
        if: steps.test.outputs.status != '0'
        run: exit 1
