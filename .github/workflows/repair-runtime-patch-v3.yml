name: Repair runtime patch script v3

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-runtime-patch-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Repair script by structural lines
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/apply_runtime_stability_branding_patch.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          # Make replace() idempotent.
          helper_index = next(
              i for i, line in enumerate(lines)
              if line == "    if old not in text:" and i + 1 < len(lines)
              and "raise RuntimeError" in lines[i + 1]
          )
          lines[helper_index + 1:helper_index + 1] = [
              "        if new in text:",
              "            return",
          ]

          # Remove an unused import from the generated daemon module.
          for i, line in enumerate(lines):
              if "WORKER_ERROR_EXIT_NO_CODE, WORKER_EXIT_ALL_PROCESSES, WORKER_RESTART, WORKER_SUCCESS," in line:
                  lines[i] = line.replace(", WORKER_SUCCESS,", ",")
                  break
          else:
              raise SystemExit("worker import line not found")

          # Add a dedicated channel for daemon IPC exit requests.
          channel_index = next(
              i for i, line in enumerate(lines)
              if line == "    let (exit_notify, exit_signal) = unbounded::<WorkerExitEvent>();"
          )
          lines.insert(
              channel_index + 1,
              "    let (daemon_notify, daemon_signal) = unbounded::<i32>();",
          )

          ipc_index = next(
              i for i, line in enumerate(lines)
              if line == "    if let Err(error) = ipc::initialize_and_spawn(&paths.runtime, exit_notify.clone()) {"
          )
          lines[ipc_index] = (
              "    if let Err(error) = ipc::initialize_and_spawn(&paths.runtime, daemon_notify) {"
          )

          select_index = next(
              i for i, line in enumerate(lines)
              if i > ipc_index and line == "        select! {"
          )
          daemon_branch = [
              "          recv(daemon_signal) -> code => {",
              "            match code {",
              "              Ok(DAEMON_SUCCESS) => {",
              "                info!(\"daemon exit requested through IPC\");",
              "                break;",
              "              }",
              "              Ok(other) => warn!(\"unexpected daemon IPC exit code: {other}\"),",
              "              Err(error) => {",
              "                error!(\"daemon IPC channel closed unexpectedly: {error}\");",
              "                return DAEMON_GENERAL_ERROR;",
              "              }",
              "            }",
              "          }",
          ]
          lines[select_index + 1:select_index + 1] = daemon_branch

          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          '@ | Set-Content -Path repair_patch.py -Encoding utf8NoBOM
          python repair_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to repair patch script" }
          Remove-Item repair_patch.py -Force
          python -m py_compile scripts/apply_runtime_stability_branding_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Patch script does not compile" }

      - name: Remove repair workflows and commit
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/repair-runtime-patch-v2.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/repair-runtime-patch-v3.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair runtime patch structurally"
          git push origin HEAD:feature/manual-build-dynamic-vars
