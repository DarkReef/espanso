name: Apply Clinical Dynamic Fields

on:
  push:
    branches: [build/windows-latest]
    paths:
      - '.github/workflows/apply-clinical-dynamic-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-latest
          fetch-depth: 0

      - name: Repair helper escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_clinical_dynamic_fields.py')
          text = p.read_text(encoding='utf-8')
          old = "new_recompose = '''"
          new = "new_recompose = r'''"
          if old not in text:
              raise SystemExit('new_recompose anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply implementation
        run: python3 scripts/apply_clinical_dynamic_fields.py

      - name: Verify source markers
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'pub enum ClinicalFieldKind' espanso-editor/src/clinical_extender_core.rs
          grep -F 'field_values: BTreeMap<String, String>' espanso-editor/src/clinical_extender_core.rs
          grep -F 'therapy_start + 2w' espanso-editor/src/clinical_extender_core.rs
          grep -F 'checked_add_months' espanso-editor/src/clinical_extender_core.rs
          grep -F 'self.dynamic_fields_ui(ui);' espanso-editor/src/clinical_extender.rs
          grep -F 'chrono.workspace = true' espanso-editor/Cargo.toml

      - name: Format, refresh lockfile, and test Clinical Editor
        run: |
          cargo fmt --all
          cargo test -p espanso-editor --lib -- --nocapture
          cargo test --locked -p espanso-editor --lib -- --nocapture

      - name: Commit implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'rEspanso CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock scripts/apply_clinical_dynamic_fields.py espanso-editor/Cargo.toml espanso-editor/src/clinical_extender_core.rs espanso-editor/src/clinical_extender.rs
          git commit -m 'feat(clinical): add dynamic fields and date arithmetic'
          git push origin HEAD:build/windows-latest
