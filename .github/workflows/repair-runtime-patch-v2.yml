name: Repair runtime patch script v2

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-runtime-patch-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Make patch idempotent and separate daemon IPC channel
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/apply_runtime_stability_branding_patch.py")
          text = path.read_text(encoding="utf-8")

          old = '''    if old not in text:
              raise RuntimeError(f"anchor not found in {path}: {old[:120]!r}")
          updated = text.replace(old, new, count)
          '''
          new = '''    if old not in text:
              if new in text:
                  return
              raise RuntimeError(f"anchor not found in {path}: {old[:120]!r}")
          updated = text.replace(old, new, count)
          '''
          if old not in text:
              raise SystemExit("replace helper anchor missing")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''        WORKER_ERROR_EXIT_NO_CODE, WORKER_EXIT_ALL_PROCESSES, WORKER_RESTART, WORKER_SUCCESS,
          ''',
              '''        WORKER_ERROR_EXIT_NO_CODE, WORKER_EXIT_ALL_PROCESSES, WORKER_RESTART,
          ''',
              1,
          )

          old = '''    let (exit_notify, exit_signal) = unbounded::<WorkerExitEvent>();
              let mut current_worker_pid = match spawn_worker_with_retry(
          '''
          new = '''    let (exit_notify, exit_signal) = unbounded::<WorkerExitEvent>();
              let (daemon_notify, daemon_signal) = unbounded::<i32>();
              let mut current_worker_pid = match spawn_worker_with_retry(
          '''
          if old not in text:
              raise SystemExit("worker channel anchor missing")
          text = text.replace(old, new, 1)

          old = '''    if let Err(error) = ipc::initialize_and_spawn(&paths.runtime, exit_notify.clone()) {
          '''
          new = '''    if let Err(error) = ipc::initialize_and_spawn(&paths.runtime, daemon_notify) {
          '''
          if old not in text:
              raise SystemExit("daemon IPC initialization anchor missing")
          text = text.replace(old, new, 1)

          old = '''        select! {
                    recv(watcher_signal) -> signal => {
          '''
          new = '''        select! {
                    recv(daemon_signal) -> code => {
                      match code {
                        Ok(DAEMON_SUCCESS) => {
                          info!("daemon exit requested through IPC");
                          break;
                        }
                        Ok(other) => warn!("unexpected daemon IPC exit code: {other}"),
                        Err(error) => {
                          error!("daemon IPC channel closed unexpectedly: {error}");
                          return DAEMON_GENERAL_ERROR;
                        }
                      }
                    }
                    recv(watcher_signal) -> signal => {
          '''
          if old not in text:
              raise SystemExit("select anchor missing")
          text = text.replace(old, new, 1)

          # Avoid an unnecessary fragile rename replacement; apply it with a tolerant inline edit.
          old = '''replace(
              "espanso/src/cli/service/win.rs",
              'Ok(parent.join("espanso.lnk"))',
              'Ok(parent.join("rEspanso.lnk"))',
          )
          '''
          new = '''service_shortcut = ROOT / "espanso/src/cli/service/win.rs"
          service_text = service_shortcut.read_text(encoding="utf-8")
          service_text = service_text.replace(
              'Ok(parent.join("espanso.lnk"))',
              'Ok(parent.join("rEspanso.lnk"))',
          )
          service_shortcut.write_text(service_text, encoding="utf-8", newline="\\n")
          '''
          if old not in text:
              raise SystemExit("service shortcut block missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path repair_patch.py -Encoding utf8NoBOM
          python repair_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to repair patch script" }
          Remove-Item repair_patch.py -Force
          python -m py_compile scripts/apply_runtime_stability_branding_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Patch script does not compile" }

      - name: Remove repair workflow and commit
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/repair-runtime-patch-v2.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: harden runtime patch script"
          git push origin HEAD:feature/manual-build-dynamic-vars
