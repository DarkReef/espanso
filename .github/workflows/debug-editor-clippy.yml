name: Temporary Editor Clippy Log

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/debug-editor-clippy.yml"

jobs:
  editor-clippy-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Capture Clippy
        shell: bash
        run: |
          set +e
          cargo clippy -p espanso-editor --all-targets -- --deny warnings > editor-clippy.log 2>&1
          status=$?
          echo "$status" > editor-clippy.status
          tail -n 160 editor-clippy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: editor-clippy-log
          path: |
            editor-clippy.log
            editor-clippy.status
          if-no-files-found: error
