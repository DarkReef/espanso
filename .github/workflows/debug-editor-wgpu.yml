name: Temporary Match Studio WGPU Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/debug-editor-wgpu.yml"
      - "espanso-editor/**"

jobs:
  windows-wgpu-log:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-wgpu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Capture Windows WGPU build
        shell: pwsh
        run: |
          cargo build -p espanso-editor --release *> windows-wgpu.log
          $status = $LASTEXITCODE
          Set-Content windows-wgpu.status $status
          Get-Content windows-wgpu.log -Tail 200
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wgpu-diagnostics
          path: |
            windows-wgpu.log
            windows-wgpu.status
          if-no-files-found: error

  linux-clippy-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Capture Clippy
        shell: bash
        run: |
          set +e
          cargo clippy -p espanso-editor --all-targets -- --deny warnings > editor-clippy.log 2>&1
          status=$?
          echo "$status" > editor-clippy.status
          tail -n 200 editor-clippy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: editor-clippy-diagnostics
          path: |
            editor-clippy.log
            editor-clippy.status
          if-no-files-found: error
