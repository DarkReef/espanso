name: Diagnose reactive preview native YAML and UTF-8

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/reactive-preview-native-yaml-utf8.yml

permissions:
  contents: read

concurrency:
  group: reactive-preview-native-yaml-utf8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract-and-test:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feature/reactive-rhai-preview
          fetch-depth: 0

      - name: Extract generated reactive implementation
        shell: pwsh
        run: |
          @'
          import base64
          import gzip
          from pathlib import Path
          import re
          import subprocess

          SOURCE_COMMIT = "1eca9078c69c3254d8488a16d5737b175ea56b8e"
          source = subprocess.check_output(
              ["git", "show", f"{SOURCE_COMMIT}:.github/workflows/temp-reactive-rhai-preview.yml"],
              text=True,
              encoding="utf-8",
          )
          match = re.search(
              r"@'\n(?P<data>[A-Za-z0-9+/=]+)\n'@ \| Set-Content -Path reactive_patch\.b64",
              source,
          )
          if not match:
              raise SystemExit("encoded reactive preview patch was not found")

          patch = gzip.decompress(base64.b64decode(match.group("data"))).decode("utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = (
              "updated, count = re.subn("
              "pattern, lambda _match: replacement, text, count=1, flags=flags)"
          )
          if patch.count(old) != 1:
              raise SystemExit("regex replacement helper anchor was not found exactly once")
          patch = patch.replace(old, new, 1)
          Path("reactive_patch.py").write_text(patch, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path extract_reactive_patch.py -Encoding utf8
          python extract_reactive_patch.py
          python reactive_patch.py

      - name: Apply native YAML renderer fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          renderer = Path("espanso-render/src/renderer/mod.rs")
          text = renderer.read_text(encoding="utf-8")
          old_import = "use self::util::{inject_variables_into_params, render_variables};"
          new_import = "use self::util::{\n    inject_form_variables_into_params, inject_variables_into_params, render_variables,\n};"
          if old_import not in text:
              raise SystemExit("renderer import anchor was not found")
          text = text.replace(old_import, new_import, 1)

          old_call = """            let variable_params = if variable.inject_vars {\n                match inject_variables_into_params(&variable.params, &scope) {"""
          new_call = """            let variable_params = if variable.inject_vars {\n                let injected_params = if variable.var_type == \"form\" {\n                    inject_form_variables_into_params(&variable.params, &scope)\n                } else {\n                    inject_variables_into_params(&variable.params, &scope)\n                };\n\n                match injected_params {"""
          if old_call not in text:
              raise SystemExit("renderer injection anchor was not found")
          renderer.write_text(text.replace(old_call, new_call, 1), encoding="utf-8", newline="\n")

          util = Path("espanso-render/src/renderer/util.rs")
          text = util.read_text(encoding="utf-8")
          anchor = """pub fn inject_variables_into_params(params: &Params, scope: &Scope) -> Result<Params> {\n    let mut params = params.clone();\n\n    for value in &mut params.values_mut() {\n        inject_variables_into_value(value, scope)?;\n    }\n\n    Ok(params)\n}\n"""
          addition = anchor + """\n/// Inject ordinary renderer variables into form parameters while preserving\n/// placeholders owned by the reactive form engine.\n///\n/// `preview_layout` and `computed` are evaluated only after the form exists and\n/// its controls have values. Resolving them in the outer renderer would make a\n/// clean YAML placeholder such as `{{score}}` fail before the form opens.\npub fn inject_form_variables_into_params(params: &Params, scope: &Scope) -> Result<Params> {\n    let mut params = params.clone();\n\n    for (name, value) in &mut params {\n        if name == \"preview_layout\" || name == \"computed\" {\n            continue;\n        }\n        inject_variables_into_value(value, scope)?;\n    }\n\n    Ok(params)\n}\n"""
          if anchor not in text:
              raise SystemExit("renderer util anchor was not found")
          util.write_text(text.replace(anchor, addition, 1), encoding="utf-8", newline="\n")
          '@ | Set-Content -Path apply_native_yaml_fix.py -Encoding utf8
          python apply_native_yaml_fix.py

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Format and test renderer
        run: |
          cargo fmt --all
          cargo test --locked -p espanso-render --lib

      - name: Upload generated reactive sources
        uses: actions/upload-artifact@v4
        with:
          name: reactive-preview-generated-sources
          path: |
            espanso-render/src/renderer/mod.rs
            espanso-render/src/renderer/util.rs
            espanso-render/src/extension/form.rs
            espanso-modulo/src/form/config.rs
            espanso-modulo/src/form/generator.rs
            espanso-modulo/src/sys/form/form.cpp
            espanso/src/cli/modulo/reactive_preview.rs
            espanso/src/cli/modulo/form.rs
            espanso/src/gui/modulo/form.rs
            docs/respanso/REACTIVE_RHAI_PREVIEW.ru.md
            examples/medical-calculators/medical-calculators.yml
          if-no-files-found: error
          retention-days: 7
