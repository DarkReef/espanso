name: Apply animated tray and config transfer

on:
  push:
    branches:
      - feature/animated-tray-config-transfer
    paths:
      - scripts/apply_animated_tray_config_transfer.py
      - scripts/.animated_transfer_chunks/**
      - .github/workflows/apply-animated-tray-config-transfer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/animated-tray-config-transfer
          fetch-depth: 1

      - name: Apply source changes
        run: python scripts/apply_animated_tray_config_transfer.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Install Studio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libdbus-1-dev libssl-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxtst-dev

      - name: Test Match Studio
        run: cargo test --quiet -p espanso-editor

      - name: Lint Match Studio
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

      - name: Validate patch
        run: git diff --check

      - name: Remove one-time helpers
        run: |
          rm -rf scripts/.animated_transfer_chunks
          rm -f scripts/apply_animated_tray_config_transfer.py
          rm -f .github/workflows/apply-animated-tray-config-transfer.yml

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add animated storm tray and config transfer"
          git push origin HEAD:feature/animated-tray-config-transfer
