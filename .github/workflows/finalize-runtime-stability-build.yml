name: Clean temporary runtime automation

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Remove temporary runtime files
        shell: bash
        run: |
          rm -f \
            .github/workflows/diagnose-runtime-generated.yml \
            .github/workflows/finalize-runtime-stability-build.yml \
            .github/workflows/repair-runtime-patch-v5.yml \
            scripts/__pycache__/apply_runtime_stability_branding_patch.cpython-312.pyc \
            scripts/runtime-stability-retrigger.txt
          rmdir scripts/__pycache__ 2>/dev/null || true

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary runtime build automation"
          git push origin HEAD:feature/manual-build-dynamic-vars
