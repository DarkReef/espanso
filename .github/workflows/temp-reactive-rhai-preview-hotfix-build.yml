name: Reactive Rhai preview hotfix build

on:
  push:
    branches:
      - feature/reactive-rhai-preview
    paths:
      - .github/workflows/temp-reactive-rhai-preview-hotfix-build.yml

permissions:
  contents: read

concurrency:
  group: reactive-rhai-preview-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout reactive preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/reactive-rhai-preview
          fetch-depth: 0

      - name: Extract and apply reactive preview implementation
        shell: pwsh
        run: |
          @'
          import base64
          import gzip
          from pathlib import Path
          import re
          import subprocess

          source_commit = "1eca9078c69c3254d8488a16d5737b175ea56b8e"
          source = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/temp-reactive-rhai-preview.yml"],
              text=True,
              encoding="utf-8",
          )
          match = re.search(
              r"@'\n(?P<data>[A-Za-z0-9+/=]+)\n'@ \| Set-Content -Path reactive_patch\.b64",
              source,
          )
          if not match:
              raise SystemExit("encoded reactive preview patch was not found")

          patch = gzip.decompress(base64.b64decode(match.group("data"))).decode("utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if patch.count(old) != 1:
              raise SystemExit("regex helper repair anchor was not found exactly once")
          Path("reactive_patch.py").write_text(patch.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | Set-Content -Path extract_reactive_patch.py -Encoding utf8
          python extract_reactive_patch.py
          python reactive_patch.py

      - name: Repair generated evaluator test borrow
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          old = "let incoming = evaluator.provider();"
          new = "let incoming = evaluator.provider().clone();"
          changed = []
          for path in Path(".").rglob("*.rs"):
              if "target" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
                  changed.append((str(path), count))
          if sum(count for _, count in changed) != 1:
              raise SystemExit(f"expected one evaluator borrow anchor, found: {changed}")
          print(f"repaired {changed[0][0]}")
          '@ | Set-Content -Path repair_reactive_borrow.py -Encoding utf8
          python repair_reactive_borrow.py

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Format generated sources
        run: cargo fmt --all

      - name: Test native form model
        run: cargo test --locked -p espanso-modulo --lib

      - name: Test render extensions
        run: cargo test --locked -p espanso-render --lib

      - name: Test reactive Rhai evaluator
        run: cargo test --locked -p espanso reactive_preview

      - name: Check full integration
        run: cargo check --locked -p espanso --all-targets

      - name: Test Match Studio
        run: cargo test --locked -p espanso-editor --lib

      - name: Build rEspanso core and portable launcher
        run: cargo build --locked --release -p espanso --bin espanso --bin respanso-portable

      - name: Build Match Studio
        run: cargo build --locked --release -p espanso-editor --bin espanso-editor

      - name: Assemble and verify portable archive
        shell: pwsh
        run: |
          ./scripts/build_windows_native_portable_with_studio.ps1
          $archive = "target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip"
          if (-not (Test-Path $archive -PathType Leaf)) { throw "portable archive was not created" }
          $entries = tar -tf $archive
          foreach ($file in @("rEspanso.exe", "rEspanso-core.exe", "rEspanso Match Studio.exe")) {
            if (-not ($entries -match [regex]::Escape($file))) { throw "archive is missing $file" }
          }
          if ($entries -match '\.(bat|cmd)$') { throw "archive contains BAT/CMD launchers" }
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "target/windows/reactive-rhai-preview.sha256.txt"

      - name: Upload reactive preview build
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-x64-reactive-rhai-preview
          path: |
            target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
            target/windows/reactive-rhai-preview.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reactive-rhai-preview-hotfix-failure
          path: |
            reactive_patch.py
            repair_reactive_borrow.py
            espanso/src/cli/modulo/reactive_preview.rs
          if-no-files-found: warn
          retention-days: 3
