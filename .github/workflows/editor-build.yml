name: Match Studio Build

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "espanso/src/main.rs"
      - "scripts/**"
      - ".github/workflows/editor-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  editor-quality:
    name: editor-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p espanso-editor
      - name: Test
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

  windows-release:
    name: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        shell: pwsh
        run: cargo build -p espanso-editor --release
      - name: Assemble standalone package
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/espanso-editor.exe")) { throw "espanso-editor.exe was not built" }
          New-Item -ItemType Directory -Force -Path "dist/respanso-match-studio-windows-x86_64" | Out-Null
          Copy-Item "target/release/espanso-editor.exe" "dist/respanso-match-studio-windows-x86_64/espanso-editor.exe"
          Set-Content -Path "dist/respanso-match-studio-windows-x86_64/OPEN_MATCH_STUDIO.cmd" -Encoding ASCII -Value '@"%~dp0espanso-editor.exe"'
          Set-Content -Path "dist/respanso-match-studio-windows-x86_64/README.txt" -Encoding UTF8 -Value @'
          rEspanso Match Studio

          Run OPEN_MATCH_STUDIO.cmd or espanso-editor.exe.

          Config root resolution order:
          1. --config-dir <path>
          2. ESPANSO_CONFIG_DIR
          3. .espanso next to the executable (portable mode)
          4. %APPDATA%\espanso
          '@
          Compress-Archive -Path "dist/respanso-match-studio-windows-x86_64" -DestinationPath "dist/respanso-match-studio-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-windows-x86_64
          path: dist/respanso-match-studio-windows-x86_64.zip
          if-no-files-found: error

  linux-release:
    name: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble standalone archive
        run: |
          test -x target/release/espanso-editor
          mkdir -p dist/respanso-match-studio-linux-x86_64
          cp target/release/espanso-editor dist/respanso-match-studio-linux-x86_64/
          cat > dist/respanso-match-studio-linux-x86_64/open-match-studio.sh <<'SH'
          #!/usr/bin/env sh
          exec "$(dirname "$0")/espanso-editor"
          SH
          chmod +x dist/respanso-match-studio-linux-x86_64/open-match-studio.sh
          tar -C dist -czf dist/respanso-match-studio-linux-x86_64.tar.gz respanso-match-studio-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-linux-x86_64
          path: dist/respanso-match-studio-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-release:
    name: macos-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble standalone archive
        run: |
          test -x target/release/espanso-editor
          mkdir -p dist/respanso-match-studio-macos
          cp target/release/espanso-editor dist/respanso-match-studio-macos/
          cat > dist/respanso-match-studio-macos/open-match-studio.command <<'SH'
          #!/usr/bin/env sh
          exec "$(dirname "$0")/espanso-editor"
          SH
          chmod +x dist/respanso-match-studio-macos/open-match-studio.command
          ditto -c -k --sequesterRsrc --keepParent dist/respanso-match-studio-macos dist/respanso-match-studio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-macos
          path: dist/respanso-match-studio-macos.zip
          if-no-files-found: error
