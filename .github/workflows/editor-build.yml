name: Match Studio Build

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "espanso-editor/**"
      - ".github/workflows/editor-build.yml"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  editor-quality:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet -- espanso-editor/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add espanso-editor/src
            git commit -m "style(editor): apply rustfmt"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Check
        run: cargo check -p espanso-editor
      - name: Test
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings
