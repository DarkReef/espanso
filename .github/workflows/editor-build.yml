name: Match Studio Build

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "espanso/src/main.rs"
      - "scripts/**"
      - ".github/workflows/editor-build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # BEGIN TEMP_GUI_PATCH
  apply-gui-studio-patch:
    name: apply-gui-studio-patch
    if: github.event_name == 'pull_request' && github.head_ref == 'gui-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: gui-studio
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Integrate Rhai tab and stable toolbar
        run: |
          sed -i 's/ui.available_width().max(320.0)/ui.available_width()/' scripts/apply_gui_studio_rhai_patch.py
          python scripts/apply_gui_studio_rhai_patch.py
          cargo fmt --all
          cargo check -p espanso-editor
      - name: Commit generated source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(editor): integrate Rhai lab and stable toolbar"
          git push origin HEAD:gui-studio
  # END TEMP_GUI_PATCH

  editor-quality:
    if: github.event_name != 'push'
    name: editor-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p espanso-editor
      - name: Test
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

  windows-release:
    if: github.event_name != 'push'
    name: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-wgpu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build WGPU Match Studio
        shell: pwsh
        run: cargo build -p espanso-editor --release
      - name: Assemble standalone and portable overlay
        shell: pwsh
        run: |
          $editor = "target/release/espanso-editor.exe"
          if (-not (Test-Path $editor)) { throw "espanso-editor.exe was not built" }

          $standalone = "dist/respanso-match-studio-windows-x86_64"
          $overlay = "dist/respanso-match-studio-portable-overlay-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$standalone/portable/config/match" | Out-Null
          New-Item -ItemType Directory -Force -Path $overlay | Out-Null
          Copy-Item $editor "$standalone/rEspanso Match Studio.exe"
          Copy-Item $editor "$overlay/rEspanso Match Studio.exe"

          # Portable package carries the MSVC runtime beside the EXE.
          $vcruntime = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\VC\Redist\MSVC\*" -and $_.FullName -like "*\x64\*" } |
            Select-Object -First 1
          if (-not $vcruntime) { throw "Microsoft Visual C++ runtime files were not found" }
          $runtimeDirectory = Split-Path $vcruntime.FullName -Parent
          Get-ChildItem -Path $runtimeDirectory -Filter "*.dll" |
            Copy-Item -Destination $standalone -Force
          Get-ChildItem -Path $runtimeDirectory -Filter "*.dll" |
            Copy-Item -Destination $overlay -Force

          @(
            'matches:',
            '  - label: "Portable-конфигурация готова"',
            '    trigger: ":respanso_example"',
            '    replace: "rEspanso Match Studio готов к работе"',
            '    disabled: true'
          ) | Set-Content -Path "$standalone/portable/config/match/base.yml" -Encoding UTF8

          Set-Content -Path "$standalone/README.txt" -Encoding UTF8 -Value @'
          rEspanso Match Studio — автономная сборка WGPU

          Запустите «rEspanso Match Studio.exe» двойным щелчком.
          Программа использует portable\config\match рядом с EXE.
          Графический интерфейс работает через WGPU/DirectX и не требует OpenGL.

          При ошибке появится русское системное окно, а подробности будут записаны
          в «rEspanso Match Studio.log» рядом с программой.
          '@

          Set-Content -Path "$overlay/README — Match Studio.txt" -Encoding UTF8 -Value @'
          rEspanso Match Studio — WGPU-дополнение к существующему rEspanso Portable

          Распакуйте содержимое этого архива непосредственно в корень portable-сборки,
          где уже находятся папка «portable» и файл «espansod.exe».

          Запускайте «rEspanso Match Studio.exe» двойным щелчком.
          Существующие portable\config\match\*.yml не изменяются и не заменяются.
          Графический интерфейс работает через WGPU/DirectX и не требует OpenGL.

          При ошибке появится русское системное окно, а подробности будут записаны
          в «rEspanso Match Studio.log» рядом с программой.
          '@

          $forbidden = Get-ChildItem -Path $standalone,$overlay -Recurse -File |
            Where-Object { $_.Extension -in ".cmd", ".bat" }
          if ($forbidden) { throw "CMD/BAT launcher unexpectedly packaged" }

          Compress-Archive -Path $standalone -DestinationPath "dist/respanso-match-studio-windows-x86_64.zip" -Force
          Compress-Archive -Path "$overlay/*" -DestinationPath "dist/respanso-match-studio-portable-overlay-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-windows-x86_64
          path: dist/respanso-match-studio-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-portable-overlay-windows-x86_64
          path: dist/respanso-match-studio-portable-overlay-windows-x86_64.zip
          if-no-files-found: error

  linux-release:
    if: github.event_name != 'push'
    name: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-linux-x86_64
          mkdir -p "$package/portable/config/match"
          cp target/release/espanso-editor "$package/rEspanso-Match-Studio"
          cat > "$package/portable/config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable-конфигурация готова"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio готов к работе"
              disabled: true
          YAML
          chmod +x "$package/rEspanso-Match-Studio"
          tar -C dist -czf dist/respanso-match-studio-linux-x86_64.tar.gz respanso-match-studio-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-linux-x86_64
          path: dist/respanso-match-studio-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-release:
    if: github.event_name != 'push'
    name: macos-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-macos
          mkdir -p "$package/portable/config/match"
          cp target/release/espanso-editor "$package/rEspanso-Match-Studio"
          cat > "$package/portable/config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable-конфигурация готова"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio готов к работе"
              disabled: true
          YAML
          chmod +x "$package/rEspanso-Match-Studio"
          ditto -c -k --sequesterRsrc --keepParent "$package" dist/respanso-match-studio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-macos
          path: dist/respanso-match-studio-macos.zip
          if-no-files-found: error
