name: Match Studio Build

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "espanso/src/main.rs"
      - "scripts/**"
      - ".github/workflows/editor-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  editor-quality:
    name: editor-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p espanso-editor
      - name: Test
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

  windows-release:
    name: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        shell: pwsh
        run: cargo build -p espanso-editor --release
      - name: Assemble portable package
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/espanso-editor.exe")) { throw "espanso-editor.exe was not built" }
          $package = "dist/respanso-match-studio-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$package/portable/config/match" | Out-Null
          Copy-Item "target/release/espanso-editor.exe" "$package/rEspanso Match Studio.exe"
          @(
            'matches:',
            '  - label: "Portable-конфигурация готова"',
            '    trigger: ":respanso_example"',
            '    replace: "rEspanso Match Studio готов к работе"',
            '    disabled: true'
          ) | Set-Content -Path "$package/portable/config/match/base.yml" -Encoding UTF8
          Set-Content -Path "$package/README.txt" -Encoding UTF8 -Value @'
          rEspanso Match Studio

          Запустите «rEspanso Match Studio.exe» двойным щелчком.
          Вспомогательный CMD-файл не требуется.

          Программа автоматически использует конфигурацию:
            portable\config

          YAML-файлы правил находятся в:
            portable\config\match
          '@
          Compress-Archive -Path $package -DestinationPath "dist/respanso-match-studio-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-windows-x86_64
          path: dist/respanso-match-studio-windows-x86_64.zip
          if-no-files-found: error

  linux-release:
    name: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-linux-x86_64
          mkdir -p "$package/portable/config/match"
          cp target/release/espanso-editor "$package/rEspanso-Match-Studio"
          cat > "$package/portable/config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable-конфигурация готова"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio готов к работе"
              disabled: true
          YAML
          chmod +x "$package/rEspanso-Match-Studio"
          tar -C dist -czf dist/respanso-match-studio-linux-x86_64.tar.gz respanso-match-studio-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-linux-x86_64
          path: dist/respanso-match-studio-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-release:
    name: macos-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-macos
          mkdir -p "$package/portable/config/match"
          cp target/release/espanso-editor "$package/rEspanso-Match-Studio"
          cat > "$package/portable/config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable-конфигурация готова"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio готов к работе"
              disabled: true
          YAML
          chmod +x "$package/rEspanso-Match-Studio"
          ditto -c -k --sequesterRsrc --keepParent "$package" dist/respanso-match-studio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-macos
          path: dist/respanso-match-studio-macos.zip
          if-no-files-found: error
