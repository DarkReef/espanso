name: Match Studio Build

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/editor-build.yml"

env:
  CARGO_TERM_COLOR: never

jobs:
  editor-quality:
    name: editor-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy -p espanso-editor --all-targets -- --deny warnings > editor-clippy.log 2>&1
          status=$?
          echo "$status" > editor-clippy.status
          tail -n 160 editor-clippy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: editor-clippy-diagnostics
          path: |
            editor-clippy.log
            editor-clippy.status
          if-no-files-found: error
