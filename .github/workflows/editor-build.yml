name: Match Studio Build

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "espanso/src/main.rs"
      - "scripts/**"
      - ".github/workflows/editor-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  editor-quality:
    name: editor-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p espanso-editor
      - name: Test
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

  windows-release:
    name: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        shell: pwsh
        run: cargo build -p espanso-editor --release
      - name: Assemble portable package
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/espanso-editor.exe")) { throw "espanso-editor.exe was not built" }
          $package = "dist/respanso-match-studio-windows-x86_64"
          $config = "$package/portable/config"
          New-Item -ItemType Directory -Force -Path "$config/match" | Out-Null
          Copy-Item "target/release/espanso-editor.exe" "$package/espanso-editor.exe"
          @(
            'matches:',
            '  - label: "Portable configuration initialized"',
            '    trigger: ":respanso_example"',
            '    replace: "rEspanso Match Studio is ready"',
            '    disabled: true'
          ) | Set-Content -Path "$config/match/base.yml" -Encoding UTF8
          Set-Content -Path "$package/OPEN_MATCH_STUDIO.cmd" -Encoding ASCII -Value '@"%~dp0espanso-editor.exe" --config-dir "%~dp0portable\config"'
          Set-Content -Path "$package/README.txt" -Encoding UTF8 -Value @'
          rEspanso Match Studio — portable configuration

          Run OPEN_MATCH_STUDIO.cmd.

          This package is explicitly bound to:
            portable\config

          Match YAML files are loaded from:
            portable\config\match

          A starter portable\config\match\base.yml is included so rules can be created immediately.
          Put additional .yml/.yaml files into portable\config\match.
          '@
          Compress-Archive -Path $package -DestinationPath "dist/respanso-match-studio-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-windows-x86_64
          path: dist/respanso-match-studio-windows-x86_64.zip
          if-no-files-found: error

  linux-release:
    name: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-linux-x86_64
          config="$package/portable/config"
          mkdir -p "$config/match"
          cp target/release/espanso-editor "$package/"
          cat > "$config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable configuration initialized"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio is ready"
              disabled: true
          YAML
          cat > "$package/open-match-studio.sh" <<'SH'
          #!/usr/bin/env sh
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$root/espanso-editor" --config-dir "$root/portable/config"
          SH
          chmod +x "$package/open-match-studio.sh"
          tar -C dist -czf dist/respanso-match-studio-linux-x86_64.tar.gz respanso-match-studio-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-linux-x86_64
          path: dist/respanso-match-studio-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-release:
    name: macos-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-match-studio-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build Match Studio
        run: cargo build -p espanso-editor --release
      - name: Assemble portable archive
        run: |
          test -x target/release/espanso-editor
          package=dist/respanso-match-studio-macos
          config="$package/portable/config"
          mkdir -p "$config/match"
          cp target/release/espanso-editor "$package/"
          cat > "$config/match/base.yml" <<'YAML'
          matches:
            - label: "Portable configuration initialized"
              trigger: ":respanso_example"
              replace: "rEspanso Match Studio is ready"
              disabled: true
          YAML
          cat > "$package/open-match-studio.command" <<'SH'
          #!/usr/bin/env sh
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$root/espanso-editor" --config-dir "$root/portable/config"
          SH
          chmod +x "$package/open-match-studio.command"
          ditto -c -k --sequesterRsrc --keepParent "$package" dist/respanso-match-studio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-match-studio-macos
          path: dist/respanso-match-studio-macos.zip
          if-no-files-found: error
