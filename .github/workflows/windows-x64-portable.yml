name: Windows dependency trace

# Temporary diagnostic run; restored to the final Windows build after tracing.
on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: read

concurrency:
  group: windows-dependency-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-windows-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Trace core Windows dependencies
        shell: bash
        run: |
          mkdir -p target/dependency-tree
          cargo tree --locked --target x86_64-pc-windows-msvc -p espanso -e features \
            > target/dependency-tree/espanso-windows-features.txt
          {
            echo '===== GDI+ feature references in espanso core ====='
            grep -n -B 12 -A 18 -E 'GdiPlus|gdiplus' target/dependency-tree/espanso-windows-features.txt || true
            echo
            echo '===== windows-targets 0.52.6 reverse tree for espanso core ====='
            cargo tree --locked --target x86_64-pc-windows-msvc -p espanso -i windows-targets@0.52.6 -e features || true
            echo
            echo '===== windows-sys 0.52.0 reverse tree for espanso core ====='
            cargo tree --locked --target x86_64-pc-windows-msvc -p espanso -i windows-sys@0.52.0 -e features || true
          } | tee target/dependency-tree/windows-gdiplus-core-trace.txt
      - name: Upload dependency trace
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-GDIPlus-core-trace
          path: target/dependency-tree/
          if-no-files-found: error
          retention-days: 3
