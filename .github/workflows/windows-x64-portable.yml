name: Apply Studio YAML and RegExp fixes

on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: write

concurrency:
  group: apply-studio-yaml-regex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patch:
    if: github.head_ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 7

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focused source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_yaml_toggle_regex_ux.py')
          text = path.read_text(encoding='utf-8')

          regex_old = 're.subn(pattern, replacement, source, count=1, flags=re.S)'
          regex_new = 're.subn(pattern, lambda _match: replacement, source, count=1, flags=re.S)'
          if text.count(regex_old) != 1:
              raise SystemExit('literal regex replacement target was not unique')
          text = text.replace(regex_old, regex_new, 1)

          anchor_old = 'normalize_yaml_file_name(input: &str)'
          anchor_new = 'normalize_yaml_file_name(value: &str)'
          if text.count(anchor_old) != 2:
              raise SystemExit(
                  f'expected two helper anchors, found {text.count(anchor_old)}'
              )
          text = text.replace(anchor_old, anchor_new)

          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply_yaml_toggle_regex_ux.py

      - name: Format and verify source
        shell: bash
        run: |
          rustfmt --edition 2021 espanso-editor/src/app.rs
          cargo fmt --all -- --check
          grep -q 'DISABLED_YAML_SUFFIX' espanso-editor/src/app.rs
          grep -q 'ESPANSO_REGEXP_DOCS_URL' espanso-editor/src/app.rs
          grep -q 'is_expected_simple_trigger_duplicate' espanso-editor/src/app.rs
          ! grep -q 'set_file_import_enabled' espanso-editor/src/app.rs

      - name: Restore manual workflow and commit
        shell: bash
        run: |
          git show fca4d8025aa915dbb18c88895e56820123a7c398:.github/workflows/windows-x64-portable.yml > .github/workflows/windows-x64-portable.yml
          rm scripts/apply_yaml_toggle_regex_ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs .github/workflows/windows-x64-portable.yml scripts/apply_yaml_toggle_regex_ux.py
          git diff --cached --check
          git commit -m "fix(studio): disable YAML files and improve RegExp UX [skip ci]"
          git push origin HEAD:feature/manual-build-dynamic-vars
