name: Restore compatible Cargo lock

# Temporary helper run; replaced by the final Windows workflow after the lock is restored.
on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: read

concurrency:
  group: restore-cargo-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-base-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export compatible base lock
        shell: bash
        run: |
          git show origin/rEspanso-feature:Cargo.lock > Cargo.lock.compatible
          test -s Cargo.lock.compatible
          grep -A 3 'name = "socket2"' Cargo.lock.compatible | head -4
      - name: Upload compatible lock
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-compatible-Cargo-lock
          path: Cargo.lock.compatible
          if-no-files-found: error
          retention-days: 3
