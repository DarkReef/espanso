name: Apply Studio YAML and RegExp fixes

on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: write

concurrency:
  group: apply-studio-yaml-regex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patch:
    if: github.head_ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 2

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focused source patch
        run: python3 scripts/apply_yaml_toggle_regex_ux.py

      - name: Format and verify source
        shell: bash
        run: |
          rustfmt --edition 2021 espanso-editor/src/app.rs
          cargo fmt --all -- --check
          grep -q 'DISABLED_YAML_SUFFIX' espanso-editor/src/app.rs
          grep -q 'ESPANSO_REGEXP_DOCS_URL' espanso-editor/src/app.rs
          grep -q 'is_expected_simple_trigger_duplicate' espanso-editor/src/app.rs
          ! grep -q 'set_file_import_enabled' espanso-editor/src/app.rs

      - name: Restore manual workflow and commit
        shell: bash
        run: |
          git show HEAD^:.github/workflows/windows-x64-portable.yml > .github/workflows/windows-x64-portable.yml
          rm scripts/apply_yaml_toggle_regex_ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs .github/workflows/windows-x64-portable.yml scripts/apply_yaml_toggle_regex_ux.py
          git diff --cached --check
          git commit -m "fix(studio): disable YAML files and improve RegExp UX [skip ci]"
          git push origin HEAD:feature/manual-build-dynamic-vars
