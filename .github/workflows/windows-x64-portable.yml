name: Apply global variables manager

on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: write

concurrency:
  group: apply-global-variables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patch:
    if: github.head_ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply global variable patch
        shell: bash
        run: python3 scripts/apply_global_variables_ui.py

      - name: Format and verify
        shell: bash
        run: |
          rustfmt --edition 2021 espanso-editor/src/app.rs espanso-editor/src/dynamic_variables.rs espanso-editor/src/global_variables.rs
          cargo fmt --all -- --check
          cargo check -p espanso-editor --all-targets
          cargo test -p espanso-editor --lib
          git diff --check

      - name: Commit source patch
        shell: bash
        run: |
          rm scripts/apply_global_variables_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs espanso-editor/src/dynamic_variables.rs espanso-editor/src/global_variables.rs scripts/apply_global_variables_ui.py
          git diff --cached --check
          git commit -m "feat(studio): manage shared global variables [skip ci]"
          git push origin HEAD:feature/manual-build-dynamic-vars
