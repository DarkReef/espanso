name: Apply Cargo lockfile

on:
  pull_request:
    branches:
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cargo-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-lockfile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Generate and verify Cargo.lock
        run: |
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > $null

      - name: Commit Cargo.lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          if (git diff --cached --quiet) {
            throw "Cargo.lock did not change"
          }
          git commit -m "fix: update Cargo lockfile"
          git push origin HEAD:feature/manual-build-dynamic-vars
