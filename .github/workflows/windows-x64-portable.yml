name: Stage remaining Clippy fixes

on:
  pull_request:
    branches:
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-remaining-clippy-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def ensure_replaced(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(
                  f"{label}: expected old=1/new=0 or old=0/new=1, got old={old_count}, new={new_count}"
              )

          ensure_replaced(
              "espanso-editor/src/app.rs",
              '''            if create && self.create_yaml_file() {
                  open = false;
              } else if cancel {
                  open = false;
              }''',
              '''            if (create && self.create_yaml_file()) || cancel {
                  open = false;
              }''',
              "create YAML dialog close condition",
          )
          ensure_replaced(
              "espanso-editor/src/dynamic_variables.rs",
              "    canonical.variable_type = variable_type.clone();",
              "    canonical.variable_type.clone_from(&variable_type);",
              "canonical variable type clone",
          )
          ensure_replaced(
              "espanso-editor/src/dynamic_variables.rs",
              '            canonical.variable_type = "date".to_owned();',
              '            "date".clone_into(&mut canonical.variable_type);',
              "time canonical type",
          )
          ensure_replaced(
              "espanso-editor/src/dynamic_variables.rs",
              r'                canonical.params_yaml = "format: \"%H:%M\"".to_owned();',
              r'                "format: \"%H:%M\"".clone_into(&mut canonical.params_yaml);',
              "time default format",
          )
          ensure_replaced(
              "espanso-editor/src/dynamic_variables.rs",
              '            canonical.variable_type = "echo".to_owned();',
              '            "echo".clone_into(&mut canonical.variable_type);',
              "string canonical type",
          )
          '@ | Set-Content -Path stage_fixes.py -Encoding utf8NoBOM
          python stage_fixes.py
          if ($LASTEXITCODE -ne 0) { throw "Patch script failed" }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Commit and push staging ref
        shell: pwsh
        run: |
          Remove-Item stage_fixes.py -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- espanso-editor/src/app.rs espanso-editor/src/dynamic_variables.rs
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "No remaining Clippy fixes were staged"
          }
          $parent = (git rev-parse HEAD).Trim()
          git commit --no-verify -m "fix: resolve remaining Studio Clippy warnings"
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed"
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -eq $parent) {
            throw "Commit SHA did not advance"
          }
          git push --force origin HEAD:refs/heads/automation/clippy-fixes
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push staging ref"
          }
          $commit | Set-Content staged-commit.txt -Encoding ascii

      - name: Upload staged commit
        uses: actions/upload-artifact@v4
        with:
          name: staged-clippy-fix-commit
          path: staged-commit.txt
          if-no-files-found: error
          retention-days: 1
