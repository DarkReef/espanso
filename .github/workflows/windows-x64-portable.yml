name: Apply remaining Clippy fixes

on:
  pull_request:
    branches:
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-remaining-clippy-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "espanso-editor/src/app.rs",
              '''            if create && self.create_yaml_file() {
                  open = false;
              } else if cancel {
                  open = false;
              }''',
              '''            if (create && self.create_yaml_file()) || cancel {
                  open = false;
              }''',
          )
          replace_exact(
              "espanso-editor/src/dynamic_variables.rs",
              "    canonical.variable_type = variable_type.clone();",
              "    canonical.variable_type.clone_from(&variable_type);",
          )
          replace_exact(
              "espanso-editor/src/dynamic_variables.rs",
              '            canonical.variable_type = "date".to_owned();',
              '            "date".clone_into(&mut canonical.variable_type);',
          )
          replace_exact(
              "espanso-editor/src/dynamic_variables.rs",
              '                canonical.params_yaml = "format: \\"%H:%M\\"".to_owned();',
              '                "format: \\"%H:%M\\"".clone_into(&mut canonical.params_yaml);',
          )
          replace_exact(
              "espanso-editor/src/dynamic_variables.rs",
              '            canonical.variable_type = "echo".to_owned();',
              '            "echo".clone_into(&mut canonical.variable_type);',
          )
          '@ | Set-Content -Path apply_remaining_fixes.py -Encoding utf8NoBOM
          python apply_remaining_fixes.py
          cargo fmt --all
          git diff --check

      - name: Commit fixes
        shell: pwsh
        run: |
          Remove-Item apply_remaining_fixes.py -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- espanso-editor/src/app.rs espanso-editor/src/dynamic_variables.rs
          if (git diff --cached --quiet) {
            throw "No remaining Clippy fixes were produced"
          }
          git commit -m "fix: resolve remaining Studio Clippy warnings"
          git push origin HEAD:feature/manual-build-dynamic-vars
