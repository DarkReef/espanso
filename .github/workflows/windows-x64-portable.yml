name: Refresh Windows dependency lock

# One-time lock refresh. Replaced by the final manual Windows workflow afterward.
on:
  pull_request:
    branches:
      - rEspanso-feature

permissions:
  contents: write

concurrency:
  group: windows-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve compatible dependency versions
        shell: bash
        run: |
          cargo update -p colored --precise 2.1.0
          cargo update -p reqwest --precise 0.11.17
          cargo update -p hyper --precise 0.14.26
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify conflicting dependency paths are gone
        shell: bash
        run: |
          mkdir -p target/dependency-tree
          cargo tree --locked -p espanso --target x86_64-pc-windows-msvc -e normal \
            > target/dependency-tree/espanso-windows-core.txt
          cat target/dependency-tree/espanso-windows-core.txt
          if grep -Eq 'socket2 v0\.5|colored v2\.2|windows-sys v0\.52\.0' \
            target/dependency-tree/espanso-windows-core.txt; then
            echo "Core still resolves a conflicting Windows import-library path" >&2
            exit 1
          fi

      - name: Commit refreshed lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "fix(windows): restore wxWidgets-compatible dependency lock [skip ci]"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Upload dependency verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-compatible-dependency-tree
          path: target/dependency-tree/espanso-windows-core.txt
          if-no-files-found: warn
          retention-days: 3
