name: Refresh Cargo lockfile

on:
  pull_request:
    branches:
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-cargo-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > $null

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: respanso-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
