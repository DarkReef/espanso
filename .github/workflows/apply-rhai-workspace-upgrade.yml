name: Clean Rhai upgrade helpers

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - scripts/apply_rhai_workspace_upgrade_bootstrap.py
      - scripts/apply_rhai_clippy_fixes.py
      - scripts/.rhai_upgrade_chunks/**
      - .github/workflows/apply-rhai-workspace-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Remove one-time helper files
        run: |
          rm -rf scripts/.rhai_upgrade_chunks
          rm -f scripts/apply_rhai_workspace_upgrade_bootstrap.py
          rm -f scripts/apply_rhai_clippy_fixes.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts
          git commit -m "chore: remove one-time Rhai upgrade helpers"
          git push origin HEAD:${{ github.head_ref }}
