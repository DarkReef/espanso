name: Temporary Editor Check Log

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/debug-editor-check.yml"

jobs:
  editor-check-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Capture cargo check
        shell: bash
        run: |
          set +e
          cargo check -p espanso-editor > editor-check.log 2>&1
          status=$?
          echo "$status" > editor-check.status
          tail -n 120 editor-check.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: editor-check-log
          path: |
            editor-check.log
            editor-check.status
          if-no-files-found: error
