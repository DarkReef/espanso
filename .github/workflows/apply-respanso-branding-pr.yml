name: Apply rEspanso branding through PR

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: apply-respanso-branding-pr
  cancel-in-progress: false

jobs:
  rebrand:
    if: github.head_ref == 'rEspanso-feature'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: rEspanso-feature
          fetch-depth: 0

      - name: Apply branding and validate formatting
        shell: bash
        run: |
          python scripts/apply_respanso_branding.py
          cargo fmt --all
          git diff --check

      - name: Commit branding without workflow mutations
        shell: bash
        run: |
          # GITHUB_TOKEN may push ordinary source changes but cannot rewrite
          # workflow definitions. Restore those files; they are cleaned up later
          # through the repository integration after the branding commit lands.
          git restore .github/workflows
          git restore scripts/apply_respanso_branding.py
          git config user.name "rEspanso Branding Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete rEspanso user-facing rebrand"
          git push origin HEAD:rEspanso-feature
