name: Apply portable layout and watcher fix

on:
  push:
    branches:
      - rEspanso-feature
    paths:
      - scripts/apply_portable_layout_watcher_fix.py
      - .github/workflows/apply-portable-layout-watcher-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rEspanso-feature
        uses: actions/checkout@v4
        with:
          ref: rEspanso-feature
          fetch-depth: 1

      - name: Apply source patch
        run: python scripts/apply_portable_layout_watcher_fix.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Run focused tests
        run: |
          cargo test --quiet -p espanso --bin respanso-portable
          cargo test --quiet -p espanso-editor

      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply_portable_layout_watcher_fix.py
          rm -f .github/workflows/apply-portable-layout-watcher-fix.yml

      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: flatten portable layout and watch Studio files"
          git push origin HEAD:rEspanso-feature
