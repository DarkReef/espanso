name: Apply portable layout and watcher fix

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - scripts/apply_portable_layout_watcher_fix.py
      - scripts/.portable_patch_chunks/**
      - .github/workflows/apply-portable-layout-watcher-fix.yml
      - .github/portable-layout-watcher-pr-trigger*.txt

permissions:
  contents: read

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply source patch
        shell: bash
        run: python scripts/apply_portable_layout_watcher_fix.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Package patched files
        shell: bash
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > patched-files.txt
          git diff --binary > patched-source.diff
          tar -czf patched-files.tar.gz -T patched-files.txt

      - name: Upload patched source bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable-layout-patched-source-${{ github.sha }}
          path: |
            patched-files.txt
            patched-source.diff
            patched-files.tar.gz
          if-no-files-found: error
          retention-days: 7
