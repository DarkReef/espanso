name: Apply portable layout and watcher fix

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - scripts/apply_portable_layout_watcher_fix.py
      - scripts/.portable_patch_chunks/**
      - .github/workflows/apply-portable-layout-watcher-fix.yml
      - .github/portable-layout-watcher-pr-trigger*.txt

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply source patch
        shell: bash
        run: python scripts/apply_portable_layout_watcher_fix.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit non-workflow source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/build-respanso-windows.yml
          git commit -m "fix: flatten portable layout and watch Studio files"
          git push origin HEAD:${{ github.head_ref }}
