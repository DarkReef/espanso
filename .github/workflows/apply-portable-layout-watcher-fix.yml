name: Apply portable layout and watcher fix

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - scripts/apply_portable_layout_watcher_fix.py
      - scripts/.portable_patch_chunks/**
      - .github/workflows/apply-portable-layout-watcher-fix.yml
      - .github/portable-layout-watcher-pr-trigger*.txt

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply source patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          python scripts/apply_portable_layout_watcher_fix.py > .github/portable-layout-patch.log 2>&1

      - name: Commit patch diagnostics
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/portable-layout-patch.log
          git commit -m "chore: record portable patch failure"
          git push origin HEAD:${{ github.head_ref }}
          exit 1

      - name: Format Rust sources
        if: steps.patch.outcome == 'success'
        run: cargo fmt --all

      - name: Run focused tests
        if: steps.patch.outcome == 'success'
        run: |
          cargo test --quiet -p espanso --bin respanso-portable
          cargo test --quiet -p espanso-editor

      - name: Remove one-time patch files
        if: steps.patch.outcome == 'success'
        run: |
          rm -f scripts/apply_portable_layout_watcher_fix.py
          rm -rf scripts/.portable_patch_chunks
          rm -f .github/workflows/apply-portable-layout-watcher-fix.yml
          rm -f .github/portable-layout-watcher-pr-trigger.txt
          rm -f .github/portable-layout-watcher-pr-trigger-2.txt
          rm -f .github/portable-layout-patch.log

      - name: Commit applied fix
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: flatten portable layout and watch Studio files"
          git push origin HEAD:${{ github.head_ref }}
