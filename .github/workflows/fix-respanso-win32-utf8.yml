name: Fix rEspanso Win32 UTF-8 menu labels

on:
  push:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/fix-respanso-win32-utf8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-win32-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rEspanso-feature
          fetch-depth: 0

      - name: Finish UTF-8 conversion for all tray menu labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("espanso-ui/src/win32/native.cpp")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "std::wstring result(static_cast<size_t>(length), L'\\0');\n"
              "    MultiByteToWideChar(CP_UTF8, MB_ERR_INVALID_CHARS, value.c_str(),\n"
              "                        static_cast<int>(value.size()), result.data(), length);",
              "std::wstring result(static_cast<size_t>(length), L'\\0');\n"
              "    MultiByteToWideChar(CP_UTF8, MB_ERR_INVALID_CHARS, value.c_str(),\n"
              "                        static_cast<int>(value.size()), &result[0], length);",
              1,
          )
          source = source.replace(
              "            // Convert to wide chars\n"
              "            std::wstring wide_label(label.length(), L'#');\n"
              "            mbstowcs(&wide_label[0], label.c_str(), label.length());",
              "            // Labels arrive from Rust as UTF-8 JSON strings.\n"
              "            std::wstring wide_label = utf8_to_wide(label);",
              1,
          )
          if "mbstowcs" in source:
              raise SystemExit("locale-dependent mbstowcs conversion is still present")
          if source.count("utf8_to_wide(label)") != 2:
              raise SystemExit("expected UTF-8 conversion for simple and submenu labels")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-respanso-win32-utf8.yml

      - name: Commit Win32 encoding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(win32): render Russian tray labels as UTF-8"
          git push origin HEAD:rEspanso-feature
