name: Diagnose final Match Studio Clippy

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/apply-final-studio-ux.yml
      - scripts/apply_final_studio_ux.py
      - scripts/.patch_chunks/**

permissions:
  contents: read

jobs:
  diagnose-clippy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finalize-studio-ux
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: final-studio-ux-${{ hashFiles('**/Cargo.lock') }}
      - name: Apply Studio UX patch
        shell: pwsh
        run: python scripts/apply_final_studio_ux.py
      - name: Format Rust sources
        shell: pwsh
        run: cargo fmt --all
      - name: Capture strict editor Clippy
        id: clippy
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo clippy -p espanso-editor --all-targets -- --deny warnings *>&1 | Tee-Object -FilePath clippy.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-studio-ux-clippy-log-${{ github.sha }}
          path: clippy.log
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Clippy failure
        if: steps.clippy.outcome == 'failure'
        shell: pwsh
        run: exit 1
