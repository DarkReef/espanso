name: Fix PR15 trigger to regexp conversion

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  fix-trigger-to-regex:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch trigger to regexp conversion
        shell: python
        run: |
          from pathlib import Path

          path = Path("espanso-editor/src/app.rs")
          text = path.read_text(encoding="utf-8")

          transition_marker = (
              '            ui.selectable_value(&mut self.draft.kind, MatchKind::Regex, "Гибкий RegExp");\n'
              '        });\n'
          )
          transition = '''            ui.selectable_value(&mut self.draft.kind, MatchKind::Regex, "Гибкий RegExp");
          });
          if previous_draft.kind == MatchKind::Trigger && self.draft.kind == MatchKind::Regex {
              if self.draft.regex.trim().is_empty() {
                  self.draft.regex = literal_trigger_regex(&previous_draft.triggers);
              }
              let examples = previous_draft
                  .triggers
                  .iter()
                  .map(String::as_str)
                  .filter(|trigger| !trigger.trim().is_empty())
                  .collect::<Vec<_>>();
              if !examples.is_empty() {
                  self.regex_examples_text = examples.join("\\n");
              }
              self.refresh_regex_examples();
          }
          '''
          if transition_marker not in text:
              raise SystemExit("structured editor transition marker not found")
          text = text.replace(transition_marker, transition, 1)

          helper_anchor = "fn relative_display(root: &Path, path: &Path) -> String {\n"
          helper = '''fn literal_trigger_regex(triggers: &[String]) -> String {
              let escaped = triggers
                  .iter()
                  .map(String::as_str)
                  .filter(|trigger| !trigger.trim().is_empty())
                  .map(regex::escape)
                  .collect::<Vec<_>>();
              match escaped.as_slice() {
                  [] => String::new(),
                  [trigger] => format!("{trigger}$"),
                  _ => format!("(?:{})$", escaped.join("|")),
              }
          }

          '''
          if helper_anchor not in text:
              raise SystemExit("helper insertion anchor not found")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          test_block = '''

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn converts_trigger_to_literal_end_anchored_regexp() {
                  let pattern = literal_trigger_regex(&[":doc".to_owned()]);
                  assert_eq!(pattern, ":doc$");
                  let regex = regex::Regex::new(&pattern).expect("converted regexp");
                  assert!(regex.is_match("текст :doc"));
                  assert!(!regex.is_match("текст :doc продолжение"));
              }

              #[test]
              fn converts_multiple_triggers_and_escapes_regexp_metacharacters() {
                  let pattern = literal_trigger_regex(&[":a.b".to_owned(), ":c+".to_owned()]);
                  assert_eq!(pattern, r"(?::a\\.b|:c\\+)$");
                  let regex = regex::Regex::new(&pattern).expect("converted regexp");
                  assert!(regex.is_match("до :a.b"));
                  assert!(regex.is_match("до :c+"));
                  assert!(!regex.is_match("до :axb"));
              }
          }
          '''
          if "fn converts_trigger_to_literal_end_anchored_regexp()" in text:
              raise SystemExit("tests already exist")
          text = text.rstrip() + test_block + "\n"
          path.write_text(text, encoding="utf-8")

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test Match Studio
        run: cargo test -p espanso-editor --lib

      - name: Strict Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-pr15-trigger-to-regex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs .github/workflows/fix-pr15-trigger-to-regex.yml
          git commit -m "fix(editor): convert triggers when switching to regexp"
          git push origin HEAD:feature/manual-build-dynamic-vars
