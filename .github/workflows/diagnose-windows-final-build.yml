name: Diagnose final Windows build

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/diagnose-windows-final-build.yml

permissions:
  contents: read

jobs:
  windows-build-log:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: diagnose-final-windows-${{ hashFiles('**/Cargo.lock') }}
      - name: Capture release build output
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo build --release -p espanso --bin espanso --bin respanso-portable --verbose *>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload Windows build log
        uses: actions/upload-artifact@v4
        with:
          name: final-windows-build-log-${{ github.sha }}
          path: windows-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Preserve build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
