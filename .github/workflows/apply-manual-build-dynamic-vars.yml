name: Apply requested Match Studio update

on:
  push:
    branches:
      - feature/manual-build-dynamic-vars
    paths:
      - .github/workflows/apply-manual-build-dynamic-vars.yml

permissions:
  contents: write

jobs:
  patch-build-and-clean:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Set up Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: manual-dynamic-vars-${{ hashFiles('**/Cargo.lock') }}

      - name: Apply source changes and clean workflows
        shell: pwsh
        run: |
          @'
          use eframe::egui;
          use serde::Deserialize;
          use std::fmt::Write as _;

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct VariableDefinition {
              pub name: String,
              pub variable_type: String,
              pub params_yaml: String,
          }

          impl VariableDefinition {
              #[must_use]
              pub fn placeholder(&self) -> String {
                  format!("{{{{{}}}}}", self.name)
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct DynamicVariableAction {
              pub definition: VariableDefinition,
              pub placeholder: String,
              pub message: String,
          }

          pub struct DynamicVariableDialog {
              name: String,
              variable_type: String,
              params_yaml: String,
              error: Option<String>,
          }

          impl Default for DynamicVariableDialog {
              fn default() -> Self {
                  Self {
                      name: "my_date".to_owned(),
                      variable_type: "date".to_owned(),
                      params_yaml: "format: \"%d.%m.%Y\"".to_owned(),
                      error: None,
                  }
              }
          }

          impl DynamicVariableDialog {
              pub fn show(
                  &mut self,
                  context: &egui::Context,
                  open: &mut bool,
              ) -> Option<DynamicVariableAction> {
                  let mut action = None;
                  let mut close_requested = false;
                  egui::Window::new("Динамические переменные")
                      .open(open)
                      .default_width(620.0)
                      .resizable(true)
                      .show(context, |ui| {
                          ui.label(
                              "Переменная добавляется в vars выбранного правила, а её шаблон — в конец текста подстановки.",
                          );
                          ui.add_space(6.0);
                          ui.heading("Готовые переменные");
                          ui.horizontal_wrapped(|ui| {
                              if ui
                                  .button("{{date}}")
                                  .on_hover_text("Текущая дата: 28.07.2026")
                                  .clicked()
                              {
                                  action = Some(preset_action(
                                      "date",
                                      "date",
                                      "format: \"%d.%m.%Y\"",
                                      "Добавлена переменная текущей даты {{date}}",
                                  ));
                                  close_requested = true;
                              }
                              if ui
                                  .button("{{time}}")
                                  .on_hover_text("Текущее время: 16:45")
                                  .clicked()
                              {
                                  action = Some(preset_action(
                                      "time",
                                      "date",
                                      "format: \"%H:%M\"",
                                      "Добавлена переменная текущего времени {{time}}",
                                  ));
                                  close_requested = true;
                              }
                              if ui
                                  .button("{{weekday}}")
                                  .on_hover_text("Название дня недели")
                                  .clicked()
                              {
                                  action = Some(preset_action(
                                      "weekday",
                                      "date",
                                      "format: \"%A\"\nlocale: \"ru-RU\"",
                                      "Добавлена переменная дня недели {{weekday}}",
                                  ));
                                  close_requested = true;
                              }
                              if ui
                                  .button("{{clipboard}}")
                                  .on_hover_text("Текущее содержимое буфера обмена")
                                  .clicked()
                              {
                                  action = Some(preset_action(
                                      "clipboard",
                                      "clipboard",
                                      "",
                                      "Добавлена переменная буфера обмена {{clipboard}}",
                                  ));
                                  close_requested = true;
                              }
                          });
                          ui.label(
                              egui::RichText::new(
                                  "Для RegExp-группы (?P<patient>...) используйте {{patient}} — отдельный блок vars не нужен.",
                              )
                              .weak(),
                          );

                          ui.separator();
                          ui.heading("Своя переменная");
                          egui::Grid::new("custom_dynamic_variable_grid")
                              .num_columns(2)
                              .spacing([12.0, 8.0])
                              .show(ui, |ui| {
                                  ui.label("Имя");
                                  ui.add(
                                      egui::TextEdit::singleline(&mut self.name)
                                          .desired_width(360.0)
                                          .hint_text("Латиницей: patient_date"),
                                  );
                                  ui.end_row();

                                  ui.label("Тип");
                                  ui.add(
                                      egui::TextEdit::singleline(&mut self.variable_type)
                                          .desired_width(360.0)
                                          .hint_text("date, clipboard, shell, script, random…"),
                                  );
                                  ui.end_row();
                              });
                          ui.label("Параметры YAML без строки params: (можно оставить пустыми)");
                          ui.add(
                              egui::TextEdit::multiline(&mut self.params_yaml)
                                  .code_editor()
                                  .desired_rows(5)
                                  .desired_width(f32::INFINITY)
                                  .hint_text("format: \"%d.%m.%Y\""),
                          );
                          ui.monospace(format!("Шаблон: {{{{{}}}}}", self.name.trim()));

                          if let Some(error) = &self.error {
                              ui.colored_label(ui.visuals().error_fg_color, error);
                          }

                          ui.horizontal(|ui| {
                              if ui.button("Добавить переменную").clicked() {
                                  let definition = VariableDefinition {
                                      name: self.name.trim().to_owned(),
                                      variable_type: self.variable_type.trim().to_owned(),
                                      params_yaml: self.params_yaml.trim().to_owned(),
                                  };
                                  match validate_definition(&definition) {
                                      Ok(()) => {
                                          let placeholder = definition.placeholder();
                                          action = Some(DynamicVariableAction {
                                              message: format!(
                                                  "Добавлена пользовательская переменная {placeholder}"
                                              ),
                                              placeholder,
                                              definition,
                                          });
                                          self.error = None;
                                          close_requested = true;
                                      }
                                      Err(error) => self.error = Some(error),
                                  }
                              }
                              if ui.button("Закрыть").clicked() {
                                  close_requested = true;
                              }
                          });
                      });
                  if close_requested {
                      *open = false;
                  }
                  action
              }
          }

          fn preset_action(
              name: &str,
              variable_type: &str,
              params_yaml: &str,
              message: &str,
          ) -> DynamicVariableAction {
              let definition = VariableDefinition {
                  name: name.to_owned(),
                  variable_type: variable_type.to_owned(),
                  params_yaml: params_yaml.to_owned(),
              };
              DynamicVariableAction {
                  placeholder: definition.placeholder(),
                  definition,
                  message: message.to_owned(),
              }
          }

          pub fn upsert_rule_variable(
              raw_rule: &str,
              definition: &VariableDefinition,
          ) -> Result<(String, bool), String> {
              validate_definition(definition)?;
              let params = normalized_params(&definition.params_yaml)?;
              let rule_indent = raw_rule
                  .lines()
                  .filter(|line| !line.trim().is_empty())
                  .map(leading_spaces)
                  .min()
                  .unwrap_or(0);
              let child_indent = rule_indent + 2;
              let mut offset = 0_usize;
              let lines = raw_rule
                  .split_inclusive('\n')
                  .map(|line| {
                      let start = offset;
                      offset += line.len();
                      (start, offset, line)
                  })
                  .collect::<Vec<_>>();

              let vars_line = lines.iter().enumerate().find_map(|(index, (start, end, line))| {
                  let trimmed = line.trim_end_matches(['\r', '\n']).trim_start();
                  if leading_spaces(line) == child_indent && trimmed.strip_prefix("vars:").is_some() {
                      Some((index, *start, *end, trimmed.to_owned()))
                  } else {
                      None
                  }
              });
              let item = render_variable(definition, params.as_deref(), child_indent + 2);

              let updated = if let Some((line_index, vars_start, vars_line_end, vars_text)) = vars_line {
                  let suffix = vars_text.strip_prefix("vars:").unwrap_or_default().trim();
                  if !suffix.is_empty() && suffix != "[]" {
                      return Err(
                          "В правиле используется компактная запись vars. Откройте «Исходный YAML» и разверните vars в список"
                              .to_owned(),
                      );
                  }

                  let mut block_end = raw_rule.len();
                  for (start, _, line) in lines.iter().skip(line_index + 1) {
                      let trimmed = line.trim();
                      if trimmed.is_empty() || trimmed.starts_with('#') {
                          continue;
                      }
                      if leading_spaces(line) <= child_indent {
                          block_end = *start;
                          break;
                      }
                  }

                  if suffix.is_empty() {
                      let block = &raw_rule[vars_start..block_end];
                      let normalized = deindent(block, child_indent);
                      let holder: VarsHolder = serde_norway::from_str(&normalized)
                          .map_err(|error| format!("Не удалось разобрать существующий vars: {error}"))?;
                      if holder.vars.iter().any(|variable| variable.name == definition.name) {
                          return Ok((raw_rule.to_owned(), false));
                      }
                      let mut result = raw_rule.to_owned();
                      result.insert_str(block_end, &item);
                      result
                  } else {
                      let mut result = String::with_capacity(raw_rule.len() + item.len());
                      result.push_str(&raw_rule[..vars_start]);
                      let _ = writeln!(result, "{}vars:", " ".repeat(child_indent));
                      result.push_str(&item);
                      result.push_str(&raw_rule[vars_line_end..]);
                      result
                  }
              } else {
                  let mut result = raw_rule.to_owned();
                  if !result.ends_with('\n') {
                      result.push('\n');
                  }
                  let _ = writeln!(result, "{}vars:", " ".repeat(child_indent));
                  result.push_str(&item);
                  result
              };

              validate_rule_yaml(&updated)?;
              Ok((updated, true))
          }

          fn validate_definition(definition: &VariableDefinition) -> Result<(), String> {
              let mut characters = definition.name.chars();
              let Some(first) = characters.next() else {
                  return Err("Укажите имя переменной".to_owned());
              };
              if !(first.is_ascii_alphabetic() || first == '_')
                  || !characters.all(|character| character.is_ascii_alphanumeric() || character == '_')
              {
                  return Err(
                      "Имя должно начинаться с латинской буквы или _, далее допустимы буквы, цифры и _"
                          .to_owned(),
                  );
              }
              if definition.variable_type.is_empty()
                  || !definition.variable_type.chars().all(|character| {
                      character.is_ascii_alphanumeric() || character == '_' || character == '-'
                  })
              {
                  return Err("Укажите корректный тип переменной".to_owned());
              }
              let _ = normalized_params(&definition.params_yaml)?;
              Ok(())
          }

          fn normalized_params(params_yaml: &str) -> Result<Option<String>, String> {
              if params_yaml.trim().is_empty() {
                  return Ok(None);
              }
              let value: serde_json::Value = serde_norway::from_str(params_yaml)
                  .map_err(|error| format!("Ошибка YAML в параметрах: {error}"))?;
              if !value.is_object() {
                  return Err("Параметры должны быть YAML-объектом вида key: value".to_owned());
              }
              let rendered = serde_norway::to_string(&value)
                  .map_err(|error| format!("Не удалось подготовить параметры: {error}"))?;
              Ok(Some(rendered.trim().to_owned()))
          }

          fn render_variable(
              definition: &VariableDefinition,
              params: Option<&str>,
              item_indent: usize,
          ) -> String {
              let field_indent = item_indent + 2;
              let params_indent = field_indent + 2;
              let name = serde_json::to_string(&definition.name).unwrap_or_else(|_| "\"\"".to_owned());
              let variable_type = serde_json::to_string(&definition.variable_type)
                  .unwrap_or_else(|_| "\"\"".to_owned());
              let mut result = format!(
                  "{}- name: {name}\n{}type: {variable_type}\n",
                  " ".repeat(item_indent),
                  " ".repeat(field_indent)
              );
              if let Some(params) = params {
                  let _ = writeln!(result, "{}params:", " ".repeat(field_indent));
                  for line in params.lines() {
                      let _ = writeln!(result, "{}{}", " ".repeat(params_indent), line);
                  }
              }
              result
          }

          fn validate_rule_yaml(raw_rule: &str) -> Result<(), String> {
              let wrapper = format!("matches:\n{}", reindent(raw_rule, 2));
              serde_norway::from_str::<serde_json::Value>(&wrapper)
                  .map(|_| ())
                  .map_err(|error| format!("Получившийся YAML правила некорректен: {error}"))
          }

          fn leading_spaces(line: &str) -> usize {
              line.chars().take_while(|character| *character == ' ').count()
          }

          fn deindent(text: &str, indent: usize) -> String {
              let mut result = String::new();
              for line in text.lines() {
                  result.push_str(line.get(indent..).unwrap_or(line));
                  result.push('\n');
              }
              result
          }

          fn reindent(text: &str, target_indent: usize) -> String {
              let minimum = text
                  .lines()
                  .filter(|line| !line.trim().is_empty())
                  .map(leading_spaces)
                  .min()
                  .unwrap_or(0);
              let prefix = " ".repeat(target_indent);
              let mut result = String::new();
              for line in text.lines() {
                  result.push_str(&prefix);
                  result.push_str(line.get(minimum..).unwrap_or(line));
                  result.push('\n');
              }
              result
          }

          #[derive(Debug, Deserialize)]
          struct VarsHolder {
              #[serde(default)]
              vars: Vec<VariableName>,
          }

          #[derive(Debug, Deserialize)]
          struct VariableName {
              name: String,
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn adds_variable_to_rule_without_vars() {
                  let definition = VariableDefinition {
                      name: "date".to_owned(),
                      variable_type: "date".to_owned(),
                      params_yaml: "format: \"%d.%m.%Y\"".to_owned(),
                  };
                  let raw = "  - trigger: \":x\"\n    replace: \"X\"\n";
                  let (updated, added) = upsert_rule_variable(raw, &definition).unwrap();
                  assert!(added);
                  assert!(updated.contains("    vars:\n      - name: \"date\""));
                  assert!(updated.contains("format: \"%d.%m.%Y\""));
              }

              #[test]
              fn does_not_duplicate_existing_variable() {
                  let definition = VariableDefinition {
                      name: "date".to_owned(),
                      variable_type: "date".to_owned(),
                      params_yaml: String::new(),
                  };
                  let raw = "  - trigger: \":x\"\n    replace: \"{{date}}\"\n    vars:\n      - name: date\n        type: date\n";
                  let (updated, added) = upsert_rule_variable(raw, &definition).unwrap();
                  assert!(!added);
                  assert_eq!(updated, raw);
              }

              #[test]
              fn expands_empty_inline_vars() {
                  let definition = VariableDefinition {
                      name: "clipboard".to_owned(),
                      variable_type: "clipboard".to_owned(),
                      params_yaml: String::new(),
                  };
                  let raw = "  - trigger: \":x\"\n    replace: \"X\"\n    vars: []\n";
                  let (updated, added) = upsert_rule_variable(raw, &definition).unwrap();
                  assert!(added);
                  assert!(updated.contains("    vars:\n      - name: \"clipboard\""));
              }

              #[test]
              fn rejects_invalid_variable_name() {
                  let definition = VariableDefinition {
                      name: "1date".to_owned(),
                      variable_type: "date".to_owned(),
                      params_yaml: String::new(),
                  };
                  assert!(upsert_rule_variable("  - trigger: \":x\"\n    replace: \"X\"\n", &definition).is_err());
              }
          }
          '@ | Set-Content -Path "espanso-editor/src/dynamic_variables.rs" -Encoding utf8NoBOM

          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("espanso-editor/src/app.rs")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "    config_transfer::{self, PackageSummary},\n",
              "    config_transfer::{self, PackageSummary},\n    dynamic_variables::{self, DynamicVariableAction, DynamicVariableDialog},\n",
              "dynamic variable import",
          )
          app = replace_once(
              app,
              "    show_diagnostics: bool,\n    show_shortcuts: bool,\n",
              "    show_diagnostics: bool,\n    show_shortcuts: bool,\n    show_dynamic_variables: bool,\n    dynamic_variables: DynamicVariableDialog,\n",
              "dynamic variable fields",
          )
          app = replace_once(
              app,
              "            show_diagnostics: true,\n            show_shortcuts: false,\n",
              "            show_diagnostics: true,\n            show_shortcuts: false,\n            show_dynamic_variables: false,\n            dynamic_variables: DynamicVariableDialog::default(),\n",
              "dynamic variable initialization",
          )
          app = app.replace(
              "Проверен устойчивый снимок проекта: изменено файлов {changed_files}",
              "Проект проверен после устойчивого изменения файлов: изменено {changed_files}",
          )
          method_marker = "    fn report_rhai_action(&mut self, result: Result<String, String>) {\n"
          method = r'''    fn add_dynamic_variable(&mut self, action: DynamicVariableAction) {
              let Some(id) = self.selected.clone() else {
                  "Сначала выберите правило".clone_into(&mut self.status);
                  return;
              };
              let previous_replace = self.draft.replace.clone();
              self.draft.replace.push_str(&action.placeholder);
              self.apply_structured();

              match dynamic_variables::upsert_rule_variable(&self.raw_rule, &action.definition) {
                  Ok((updated, added)) => {
                      let result = self
                          .workspace
                          .as_mut()
                          .ok_or_else(|| "Рабочая область YAML не загружена".to_owned())
                          .and_then(|workspace| {
                              workspace
                                  .update_rule_raw(&id, &updated)
                                  .map_err(|error| ru_message(&error.to_string()))
                          });
                      match result {
                          Ok(()) => {
                              self.refresh_selected();
                              self.status = if added {
                                  format!("{}. Нажмите Ctrl+S для записи YAML", action.message)
                              } else {
                                  format!(
                                      "Переменная {} уже была объявлена; шаблон добавлен в текст. Нажмите Ctrl+S",
                                      action.placeholder
                                  )
                              };
                          }
                          Err(error) => {
                              self.draft.replace = previous_replace;
                              self.apply_structured();
                              self.status = format!("Не удалось добавить переменную: {error}");
                          }
                      }
                  }
                  Err(error) => {
                      self.draft.replace = previous_replace;
                      self.apply_structured();
                      self.status = format!("Не удалось добавить переменную: {error}");
                  }
              }
          }

'''
          app = replace_once(app, method_marker, method + method_marker, "dynamic variable method")
          app = replace_once(
              app,
              "        ui.add_space(8.0);\n        ui.label(\"Текст подстановки\");\n        ui.add(\n",
              "        ui.add_space(8.0);\n        ui.horizontal(|ui| {\n            ui.label(\"Текст подстановки\");\n            if ui\n                .small_button(\"?\")\n                .on_hover_text(\"Динамические переменные: {{date}}, {{time}}, {{clipboard}} и свои\")\n                .clicked()\n            {\n                self.show_dynamic_variables = true;\n            }\n        });\n        ui.add(\n",
              "replacement help button",
          )
          app = replace_once(
              app,
              "        let generation = self.diagnostics.generation();\n        let active_count = self.diagnostics.active_count();\n",
              "        let active_count = self.diagnostics.active_count();\n",
              "diagnostic generation variable",
          )
          app = replace_once(
              app,
              "                ui.label(\n                    egui::RichText::new(format!(\n                        \"Снимок #{generation} · активных проблем: {active_count}\"\n                    ))\n                    .weak(),\n                );\n",
              "                ui.label(\n                    egui::RichText::new(format!(\"Активных проблем: {active_count}\")).weak(),\n                );\n",
              "diagnostic snapshot header",
          )
          app = replace_once(
              app,
              "                                    \"Наблюдений: {} · впервые: #{} · последнее: #{}\",\n                                    diagnostic.occurrence_count,\n                                    diagnostic.first_seen_generation,\n                                    diagnostic.last_seen_generation\n",
              "                                    \"Наблюдений: {}\",\n                                    diagnostic.occurrence_count\n",
              "diagnostic snapshot details",
          )
          dialog_marker = "        self.config_import_confirmation(context);\n\n        if self.show_shortcuts {\n"
          dialog_code = '''        self.config_import_confirmation(context);

          if self.show_dynamic_variables {
              let mut open = self.show_dynamic_variables;
              if let Some(action) = self.dynamic_variables.show(context, &mut open) {
                  self.add_dynamic_variable(action);
              }
              self.show_dynamic_variables = open;
          }

          if self.show_shortcuts {
'''
          app = replace_once(app, dialog_marker, dialog_code, "dynamic variable dialog")
          app_path.write_text(app, encoding="utf-8")

          lib_path = Path("espanso-editor/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          lib = replace_once(
              lib,
              "pub mod diagnostics;\n",
              "pub mod diagnostics;\npub mod dynamic_variables;\n",
              "dynamic variable module",
          )
          lib_path.write_text(lib, encoding="utf-8")

          docs_path = Path("docs/respanso/MATCH_STUDIO.ru.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs += """

          ## Динамические переменные в редакторе правил

          Рядом с заголовком «Текст подстановки» находится небольшая кнопка `?`. Она открывает список готовых переменных `{{date}}`, `{{time}}`, `{{weekday}}`, `{{clipboard}}` и форму для собственной переменной.

          При выборе Studio добавляет шаблон в конец текста и создаёт или переиспользует блок `vars` внутри выбранного правила. Для своей переменной задаются имя, тип расширения rEspanso и необязательные параметры YAML без строки `params:`.

          Пример параметров даты:

          ```yaml
          format: "%d.%m.%Y"
          ```

          После добавления нажмите `Ctrl+S`, чтобы записать изменения в YAML-файл.
          """
          docs_path.write_text(docs, encoding="utf-8")

          workflow = Path(".github/workflows/build-respanso-windows.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          start = workflow_text.index("on:\n")
          permissions = workflow_text.index("permissions:\n")
          workflow_text = workflow_text[:start] + "on:\n  workflow_dispatch:\n\n" + workflow_text[permissions:]
          workflow.write_text(workflow_text, encoding="utf-8")
          '@ | Set-Content -Path "apply_requested_changes.py" -Encoding utf8NoBOM

          python apply_requested_changes.py
          Remove-Item apply_requested_changes.py -Force

          Get-ChildItem ".github/workflows" -File | Where-Object {
            $_.Name -notin @("build-respanso-windows.yml", "apply-manual-build-dynamic-vars.yml")
          } | Remove-Item -Force

          cargo fmt --all

      - name: Run Match Studio tests
        run: cargo test --quiet -p espanso-editor

      - name: Run engine and launcher tests
        run: |
          cargo test --quiet -p espanso-engine
          cargo test --quiet -p espanso-render
          cargo test --quiet -p espanso --bin respanso-portable

      - name: Build release binaries
        run: |
          cargo build --quiet --release -p espanso --bin espanso --bin respanso-portable
          cargo build --quiet --release -p espanso-editor

      - name: Run strict Clippy
        run: cargo clippy -p espanso -p espanso-editor --all-targets -- --deny warnings

      - name: Assemble portable package
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"

      - name: Remove temporary workflow and commit final source
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/apply-manual-build-dynamic-vars.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dynamic variable helper and manual-only builds"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Upload requested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-manual-final-windows-x64
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
