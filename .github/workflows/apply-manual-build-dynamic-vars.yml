name: Stage final rEspanso source

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/apply-manual-build-dynamic-vars.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-final-respanso-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-source:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and format final source
        shell: pwsh
        run: |
          python -c "from pathlib import Path; Path('finalize.py').write_text(''.join(Path(f'.github/finalize.part{i}.py').read_text(encoding='utf-8') for i in range(1, 5)), encoding='utf-8')"
          python finalize.py
          cargo fmt --all
          $docs = Get-Content "docs/respanso/MATCH_STUDIO.ru.md" -Raw
          $docs = $docs.Replace("**Удобный редактор**", "**Редактор**")
          [System.IO.File]::WriteAllText(
            "docs/respanso/MATCH_STUDIO.ru.md",
            $docs,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit source cleanup to staging branch
        shell: pwsh
        run: |
          git checkout HEAD -- .github/workflows
          Remove-Item ".github/finalize.part*.py" -Force
          Remove-Item "finalize.py" -Force
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize rEspanso Studio source"
          git push --force origin HEAD:refs/heads/automation/finalize-respanso-source
