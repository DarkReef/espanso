name: Finalize rEspanso branch

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/apply-manual-build-dynamic-vars.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-respanso-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply final source and repository cleanup v2
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; source=gzip.decompress(base64.b64decode(pathlib.Path('.github/finalize.payload').read_text())).decode(); exec(compile(source, 'finalize.py', 'exec'))" *>&1 | Tee-Object -FilePath finalize.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Persist diagnostic on failure
        if: failure()
        shell: pwsh
        run: |
          Copy-Item finalize.log .github/diagnose-finalize.log -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/diagnose-finalize.log
          git commit -m "chore: capture finalization diagnostic"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit finalized branch
        shell: pwsh
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "Finalization produced no changes"
          }
          git commit -m "feat: finalize rEspanso Studio and Windows CI"
          git push origin HEAD:feature/manual-build-dynamic-vars
