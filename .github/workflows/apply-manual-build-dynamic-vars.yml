name: Prepare final rEspanso patch

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/apply-manual-build-dynamic-vars.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-final-respanso-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply final source and repository cleanup
        shell: pwsh
        run: |
          python -c "from pathlib import Path; Path('finalize.py').write_text(''.join(Path(f'.github/finalize.part{i}.py').read_text(encoding='utf-8') for i in range(1, 5)), encoding='utf-8')"
          python finalize.py
          cargo fmt --all

      - name: Package exact final result
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "target/finalization" | Out-Null
          Copy-Item "espanso-editor/src/app.rs" "target/finalization/app.rs"
          Copy-Item "espanso-editor/src/dynamic_variables.rs" "target/finalization/dynamic_variables.rs"
          Copy-Item "docs/respanso/MATCH_STUDIO.ru.md" "target/finalization/MATCH_STUDIO.ru.md"
          Copy-Item ".github/workflows/windows-x64-portable.yml" "target/finalization/windows-x64-portable.yml"
          cmd /c "git diff --binary > target\finalization\finalization.patch"
          git status --short | Set-Content "target/finalization/status.txt" -Encoding utf8NoBOM
          git ls-files | Set-Content "target/finalization/tracked-files.txt" -Encoding utf8NoBOM

      - name: Upload finalization preview
        uses: actions/upload-artifact@v4
        with:
          name: respanso-finalization-preview
          path: target/finalization
          if-no-files-found: error
          retention-days: 3
