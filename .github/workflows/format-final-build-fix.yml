name: Format final Windows build fix

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/format-final-build-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format final build scripts
        run: cargo fmt --all
      - name: Commit formatted build scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso/build.rs espanso-editor/build.rs
          git commit -m "style: format Windows icon build scripts"
          git push origin HEAD:feature/finalize-respanso
