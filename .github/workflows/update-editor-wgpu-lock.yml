name: Temporary Match Studio Lockfile Update

on:
  pull_request:
    paths:
      - ".github/workflows/update-editor-wgpu-lock.yml"
      - "Cargo.toml"
      - "espanso-editor/Cargo.toml"

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Align Windows bindings used by WGPU
        shell: bash
        run: |
          cargo update -p windows@0.61.1 --precise 0.62.0
          cargo check -p espanso-editor
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(editor): align WGPU Windows lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
