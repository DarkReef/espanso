name: pol_run Astra 1.7 X11 full portable

on:
  push:
    branches: [pol_run, feat/clinical-extender, build/x11-latest]
    paths:
      - '.github/workflows/pol-run-astra17-v3.yml'
      - 'scripts/build_pol_run_astra17.sh'
      - 'scripts/pol_run_tray.cpp'
      - 'espanso-ai/**'
      - 'espanso-engine/**'
      - 'espanso-editor/**'
      - 'espanso-modulo/**'
      - 'espanso/**'
      - 'espanso-detect/**'
      - 'espanso-ipc/**'
      - 'espanso-inject/**'
      - 'scripts/test_astra_*'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [pol_run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pol-run-astra17-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full X11 core + Match Studio + KDE tray
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "RESPANSO_BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RESPANSO_VERSION=$(awk -F'\"' '/^version =/ {print $2; exit}' espanso/Cargo.toml)" >> "$GITHUB_ENV"
          echo "RESPANSO_BUILD_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Verify final Astra interaction sources
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'Some("CTRL+ALT+SPACE".to_string())' espanso-config/src/config/resolve.rs
          grep -F 'std::str::from_utf8(bytes)' espanso-detect/src/x11/mod.rs
          grep -F 'raw_to_input_valid_buffer_without_nul_is_preserved' espanso-detect/src/x11/mod.rs
          grep -F 'raw_to_input_invalid_utf8_buffer_has_no_value' espanso-detect/src/x11/mod.rs
          grep -F 'sender.send((event, source_id)).is_err()' espanso/src/cli/worker/engine/funnel/mod.rs
          grep -F 'vec![Key::Control, Key::C]' espanso/src/cli/worker/engine/dispatch/executor/clipboard_injector.rs
          grep -F 'cleared stale target=' espanso-inject/src/x11/mod.rs
          grep -F 'wxScrolledWindow' espanso-modulo/src/sys/form/form.cpp
          grep -F 'raw_yaml_source_scroll' espanso-editor/src/app_legacy.rs

      - name: Build and validate full portable package in Debian 10
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -e RESPANSO_BUILD_DATE \
            -e RESPANSO_VERSION \
            -e RESPANSO_BUILD_SHA \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:buster-slim \
            bash -lc 'bash scripts/build_pol_run_astra17.sh && timeout 45s xvfb-run -a bash scripts/test_astra_expansion.sh target/release/espanso'

      - name: Verify full package
        shell: bash
        run: |
          set -euxo pipefail
          OUT=target/pol-run-astra-full
          ROOT="$OUT/rEspanso-pol_run-Astra17-X11-Full-x86_64"

          test -x "$ROOT/rEspanso-core"
          test -x "$ROOT/rEspanso-Match-Studio"
          test -x "$ROOT/rEspanso-Tray"
          test -x "$ROOT/bin/xdotool"
          test -x "$ROOT/mcp.sh"
          test -x "$ROOT/run.sh"
          test -x "$ROOT/start-tray.sh"
          test -x "$ROOT/diagnose.sh"
          test -f "$ROOT/config/default.yml"
          test -f "$ROOT/match/base.yml"
          test -f "$OUT/rEspanso-pol_run-Astra17-X11-Full-x86_64.tar.gz"

          # Help must identify the exact build the user is running.
          strings "$ROOT/rEspanso-Match-Studio" | grep -F "$RESPANSO_BUILD_DATE"
          strings "$ROOT/rEspanso-Match-Studio" | grep -F "$RESPANSO_BUILD_SHA"

          echo '=== core GLIBC requirements ==='
          cat "$ROOT/core-glibc-required.txt"
          echo '=== studio GLIBC requirements ==='
          cat "$ROOT/studio-glibc-required.txt"
          echo '=== tray GLIBC requirements ==='
          cat "$ROOT/tray-glibc-required.txt"
          echo '=== core packaged ldd ==='
          cat "$ROOT/core-packaged-ldd.txt"
          echo '=== studio packaged ldd ==='
          cat "$ROOT/studio-packaged-ldd.txt"
          echo '=== tray packaged ldd ==='
          cat "$ROOT/tray-packaged-ldd.txt"
          echo '=== archive ==='
          tar -tzf "$OUT/rEspanso-pol_run-Astra17-X11-Full-x86_64.tar.gz" | head -n 160

      - name: Upload full Astra portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-pol_run-Astra17-X11-Full-x86_64
          path: |
            target/pol-run-astra-full/rEspanso-pol_run-Astra17-X11-Full-x86_64.tar.gz
            target/pol-run-astra-full/rEspanso-pol_run-Astra17-X11-Full-x86_64.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
