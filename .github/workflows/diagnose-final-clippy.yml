name: Apply final Clippy fixes

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - scripts/fix_final_clippy.py
      - .github/workflows/diagnose-final-clippy.yml

permissions:
  contents: write

concurrency:
  group: final-clippy-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git libdbus-1-dev libssl-dev libwxgtk3.*-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxtst-dev

      - name: Apply and verify Clippy fixes
        run: |
          python scripts/fix_final_clippy.py
          cargo fmt --all
          cargo clippy -p espanso-editor --all-targets -- --deny warnings

      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/diagnostics.rs \
                  espanso-editor/src/file_monitor.rs \
                  espanso-editor/src/storm_logo.rs
          git commit -m "fix: satisfy strict Clippy in final Studio modules"
          git push origin HEAD:feature/finalize-respanso
