name: Temporary Startup Clippy Patch

on:
  pull_request:
    paths:
      - ".github/workflows/patch-editor-startup-clippy.yml"

permissions:
  contents: write

jobs:
  patch-startup-clippy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Apply unit semicolon fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("espanso-editor/src/main.rs")
          content = path.read_text()
          replacements = {
              '''        ));
              }
          }

          fn launch()''': '''        ));
              };
          }

          fn launch()''',
              '''    unsafe {
                  let _ = MessageBoxW(None, &text, &title, MB_OK | MB_ICONERROR);
              }
          }

          #[cfg(not(windows))]''': '''    unsafe {
                  let _ = MessageBoxW(None, &text, &title, MB_OK | MB_ICONERROR);
              };
          }

          #[cfg(not(windows))]''',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"expected fragment not found: {old!r}")
              content = content.replace(old, new, 1)
          path.write_text(content)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/main.rs
          git commit -m "fix(editor): satisfy startup Clippy checks"
          git push origin "HEAD:${{ github.head_ref }}"
