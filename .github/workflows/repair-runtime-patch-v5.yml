name: Repair runtime patch strict clippy

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-runtime-patch-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Repair generated Rust for strict Clippy
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/apply_runtime_stability_branding_patch.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              ".map_or(0, |duration| duration.as_secs());": ".map_or_else(|_| 0, |duration| duration.as_secs());",
              "fn daemon_main(args: CliModuleArgs) -> i32 {": "#[allow(clippy::too_many_lines, clippy::collapsible_match)]\nfn daemon_main(args: CliModuleArgs) -> i32 {",
              "fn debouncer_main(\n": "#[allow(clippy::too_many_lines)]\nfn debouncer_main(\n",
              "Ok(pid) => current_worker_pid = pid,": "Ok(pid) => {\n                            current_worker_pid = pid;\n                        }",
          }

          for old, new in replacements.items():
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit(f"repair anchor missing: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path repair_patch.py -Encoding utf8NoBOM
          python repair_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to repair generated runtime source" }
          Remove-Item repair_patch.py -Force
          python -m py_compile scripts/apply_runtime_stability_branding_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Patch script does not compile" }

      - name: Remove repair workflow and commit
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/repair-runtime-patch-v5.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: satisfy strict runtime clippy"
          git push origin HEAD:feature/manual-build-dynamic-vars
