name: Build requested rEspanso update

on:
  pull_request:
    branches:
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requested-respanso-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-build-and-finalize:
    name: Patch, test and build Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Set up Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: requested-dynamic-vars-${{ hashFiles('**/Cargo.lock') }}

      - name: Apply requested source changes
        run: |
          python scripts/apply_requested_update.py
          python scripts/fix_dynamic_variable_test.py

      - name: Format source
        run: cargo fmt --all

      - name: Run Match Studio tests
        run: cargo test --quiet -p espanso-editor

      - name: Run engine and launcher tests
        run: |
          cargo test --quiet -p espanso-engine
          cargo test --quiet -p espanso-render
          cargo test --quiet -p espanso --bin respanso-portable

      - name: Build release binaries
        run: |
          cargo build --quiet --release -p espanso --bin espanso --bin respanso-portable
          cargo build --quiet --release -p espanso-editor

      - name: Run strict Clippy
        run: cargo clippy -p espanso -p espanso-editor --all-targets -- --deny warnings

      - name: Assemble portable package
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"

      - name: Finalize manual-only workflows and commit
        shell: pwsh
        run: |
          Copy-Item "scripts/final-build-respanso-windows.yml" ".github/workflows/build-respanso-windows.yml" -Force
          Get-ChildItem ".github/workflows" -File | Where-Object {
            $_.Name -ne "build-respanso-windows.yml"
          } | Remove-Item -Force
          Remove-Item "scripts/apply_requested_update.py" -Force
          Remove-Item "scripts/fix_dynamic_variable_test.py" -Force
          Remove-Item "scripts/final-build-respanso-windows.yml" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dynamic variable helper and manual-only builds"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Upload requested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-manual-final-windows-x64
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
