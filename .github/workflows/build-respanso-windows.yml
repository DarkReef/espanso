name: Build rEspanso Windows

on:
  push:
    branches:
      - dev-in
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respanso-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Show build environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          where.exe cl
          where.exe nmake

      - name: Normalize Rust formatting in runner workspace
        run: cargo fmt --all

      - name: Run embedded runtime tests
        run: cargo test -p espanso-render

      - name: Run rEspanso engine tests
        run: cargo test -p espanso-engine

      - name: Build release binary
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release -p espanso

      - name: Verify binary
        shell: pwsh
        run: |
          $binary = "target\release\espanso.exe"
          if (-not (Test-Path $binary)) {
            throw "Release binary was not produced: $binary"
          }
          Get-Item $binary | Format-List Name,Length,LastWriteTime
          & $binary --version

      - name: Prepare portable downloadable package
        shell: pwsh
        run: |
          $out = "artifact\rEspanso-windows-x64"
          $portable = Join-Path $out "portable"
          $configDir = Join-Path $portable "config"
          $matchDir = Join-Path $configDir "match"
          $calculatorDir = Join-Path $configDir "medical-calculators"
          $runtimeDir = Join-Path $portable "runtime"
          $packagesDir = Join-Path $portable "packages"

          New-Item -ItemType Directory -Force -Path $out, $matchDir, $calculatorDir, $runtimeDir, $packagesDir | Out-Null
          Copy-Item "target\release\espanso.exe" "$out\rEspanso.exe"

          # The release binary dynamically links to the Microsoft Visual C++ runtime.
          # Copy the licensed redistributable DLLs next to the executable so the test
          # build works on Windows machines without Visual Studio or VC++ Build Tools.
          $crtRoot = Join-Path $env:VCToolsRedistDir "x64"
          $crtDir = Get-ChildItem -Path $crtRoot -Directory |
            Where-Object { $_.Name -like "Microsoft.VC*.CRT" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $crtDir) {
            throw "Unable to locate the Visual C++ x64 redistributable directory under $crtRoot"
          }

          Copy-Item (Join-Path $crtDir.FullName "*.dll") $out
          Write-Host "Bundled Visual C++ runtime from $($crtDir.FullName):"
          Get-ChildItem $out -Filter "*.dll" | Select-Object Name,Length

          Copy-Item "LICENSE" "$out\LICENSE.txt"
          Copy-Item "docs\respanso-dynamic-dialog.md" "$out\DYNAMIC-DIALOG.md"
          Copy-Item "docs\respanso-selection-match.md" "$out\SELECTION-MATCH.md"
          Copy-Item "docs\respanso-medical-calculators.md" "$out\MEDICAL-CALCULATORS.md"

          @'
          matches:
            - trigger: ":rinfo"
              replace: |
                @dialog: rEspanso — проверка
                Информационное окно работает.

            # Обычный матч Espanso. При штатном вводе он заменяется автоматически.
            # Если движок пропустил длинный триггер и текст остался в поле,
            # выделите его и нажмите Ctrl+Alt+M — rEspanso повторно найдёт
            # и исполнит тот же матч.
            - trigger: ":i10_9"
              replace: |
                @dialog: rEspanso — восстановление пропущенного матча
                Матч :i10_9 найден и выполнен.
          '@ | Set-Content (Join-Path $matchDir "respanso-test.yml") -Encoding UTF8

          # Bundle the visual form and editable Rhai module. No external runtime is
          # required on the target workstation.
          Copy-Item "examples\medical-calculators\medical-calculators.yml" (Join-Path $matchDir "medical-calculators.yml")
          Copy-Item "examples\medical-calculators\modules" (Join-Path $calculatorDir "modules") -Recurse

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "ROOT=%~dp0portable"
          if not exist "%ROOT%\config\match" mkdir "%ROOT%\config\match"
          if not exist "%ROOT%\runtime" mkdir "%ROOT%\runtime"
          if not exist "%ROOT%\packages" mkdir "%ROOT%\packages"
          start "" "%~dp0rEspanso.exe" --config_dir "%ROOT%\config" --runtime_dir "%ROOT%\runtime" --package_dir "%ROOT%\packages" launcher
          endlocal
          '@ | Set-Content "$out\START-rEspanso.cmd" -Encoding ASCII

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "ROOT=%~dp0portable"
          "%~dp0rEspanso.exe" --config_dir "%ROOT%\config" --runtime_dir "%ROOT%\runtime" --package_dir "%ROOT%\packages" service stop
          pause
          endlocal
          '@ | Set-Content "$out\STOP-rEspanso.cmd" -Encoding ASCII

          @'
          @echo off
          cd /d "%~dp0"
          "%~dp0rEspanso.exe" --version
          echo Exit code: %ERRORLEVEL%
          pause
          '@ | Set-Content "$out\TEST-BINARY.cmd" -Encoding ASCII

          @"
          rEspanso Windows x64 portable test build
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          HOW TO START
          1. Extract the entire ZIP. Do not run the EXE from inside the ZIP.
          2. Double-click START-rEspanso.cmd.
          3. Type :rinfo to test an informational dialog.
          4. Type :i10_9 normally. If Espanso catches it, the dialog opens immediately.
          5. To test the recovery path, first paste :i10_9 into Notepad with Ctrl+V
             (or use text already left behind after a missed expansion), select it,
             and press Ctrl+Alt+M. The same ordinary match must be executed.
          6. Type :calc_demo to open a visual calculator form. Its result is produced
             by the editable portable\config\medical-calculators\modules\ui-demo.rhai
             module interpreted inside rEspanso.exe.
          7. Edit ui-demo.rhai, save it, and run :calc_demo again. No compiler,
             Node.js, Python or PowerShell module is required.
          8. Use STOP-rEspanso.cmd before deleting or replacing the folder.

          The selected-text hotkey is a recovery path for ordinary Espanso matches;
          it does not require a separate selection-only rule or special match syntax.

          The package includes the required Microsoft Visual C++ runtime DLLs and
          uses isolated portable config/runtime folders, so it does not conflict
          with an installed Espanso instance.

          This is an unsigned development build. Windows SmartScreen may require:
          More info -> Run anyway, or file Properties -> Unblock.
          "@ | Set-Content "$out\README-FIRST.txt" -Encoding UTF8

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-windows-portable-x64-${{ github.sha }}
          path: artifact/rEspanso-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
