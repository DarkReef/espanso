name: Build rEspanso Windows

on:
  push:
    branches:
      - rEspanso-feature
  pull_request:
    branches:
      - dev
      - rEspanso-feature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respanso-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build native Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Show build environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          where.exe cl
          where.exe nmake

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run embedded runtime tests
        run: cargo test --quiet -p espanso-render

      - name: Run rEspanso engine tests
        run: cargo test --quiet -p espanso-engine

      - name: Run native portable launcher tests
        run: cargo test --quiet -p espanso --bin respanso-portable

      - name: Run Match Studio tests
        run: cargo test --quiet -p espanso-editor

      - name: Build rEspanso core and native launcher
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --quiet --release -p espanso --bin espanso --bin respanso-portable

      - name: Build Match Studio
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --quiet --release -p espanso-editor

      - name: Run strict Clippy
        continue-on-error: true
        run: cargo clippy -p espanso -p espanso-editor --all-targets -- --deny warnings

      - name: Verify source binaries
        shell: pwsh
        run: |
          $required = @(
            "target/release/espanso.exe",
            "target/release/respanso-portable.exe",
            "target/release/espanso-editor.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -Path $path -PathType Leaf)) {
              throw "Release binary was not produced: $path"
            }
          }
          Get-Item $required | Format-Table Name,Length,LastWriteTime

      - name: Assemble unified native portable package
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"

          $package = "target/windows/rEspanso"
          $required = @(
            "$package/rEspanso.exe",
            "$package/rEspanso-core.exe",
            "$package/rEspanso Match Studio.exe",
            "$package/config/default.yml",
            "$package/match/base.yml",
            "$package/runtime",
            "$package/packages",
            "$package/scripts/example.rhai"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Unified portable package is missing: $path"
            }
          }

          $nestedConfig = "$package/config/config"
          $legacyPortable = "$package/portable"
          if (Test-Path $nestedConfig) {
            throw "Unified portable package contains nested config/config: $nestedConfig"
          }
          if (Test-Path $legacyPortable) {
            throw "Unified portable package contains obsolete portable directory: $legacyPortable"
          }

          $forbidden = Get-ChildItem $package -Recurse -File |
            Where-Object { $_.Extension -in @(".bat", ".cmd") }
          if ($forbidden) {
            throw "Unified portable package contains BAT/CMD files: $($forbidden.FullName -join ', ')"
          }

      - name: Upload unified Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-native-portable-with-studio-windows-x64-${{ github.sha }}
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
