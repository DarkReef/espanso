name: Format final Studio source fixes

on:
  push:
    branches:
      - feature/manual-build-dynamic-vars
    paths:
      - .github/workflows/patch-studio-fixes.yml

permissions:
  contents: write

jobs:
  format-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 1

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        shell: bash
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs espanso-editor/src/workspace.rs espanso-editor/src/dynamic_variables.rs espanso-editor/src/workspace_cleanup.rs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: format final Studio fixes"
          git push origin HEAD:feature/manual-build-dynamic-vars
