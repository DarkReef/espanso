name: Apply final rEspanso polish

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - scripts/finalize_patch_a.py
      - scripts/finalize_patch_b.py
      - scripts/generate_respanso_icon.py
      - .github/workflows/apply-finalize-respanso.yml

permissions:
  contents: write

concurrency:
  group: finalize-respanso
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patches and record diagnostics
        id: apply
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -Path ".github" -ItemType Directory -Force | Out-Null
          python scripts/finalize_patch_a.py *> .github/finalize-apply.log
          if ($LASTEXITCODE -eq 0) {
            python scripts/finalize_patch_b.py *>> .github/finalize-apply.log
          }
          if ($LASTEXITCODE -eq 0) {
            python scripts/generate_respanso_icon.py *>> .github/finalize-apply.log
          }
          if ($LASTEXITCODE -eq 0) {
            cargo fmt --all *>> .github/finalize-apply.log
          }
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Commit patch diagnostics on failure
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/finalize-apply.log
          git commit -m "ci: record finalization patch failure"
          git push origin HEAD:feature/finalize-respanso

      - name: Remove one-time helpers
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item -Force scripts/finalize_patch_a.py
          Remove-Item -Force scripts/finalize_patch_b.py
          Remove-Item -Force scripts/generate_respanso_icon.py
          Remove-Item -Force .github/workflows/apply-finalize-respanso.yml
          Remove-Item -Force .github/finalize-apply.log

      - name: Commit applied finalization
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize rEspanso"
          git push origin HEAD:feature/finalize-respanso

      - name: Fail after publishing diagnostics
        if: steps.apply.outcome == 'failure'
        run: exit 1
