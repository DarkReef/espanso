name: Apply final rEspanso polish

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - scripts/finalize_patch_a.py
      - scripts/finalize_patch_b.py
      - scripts/generate_respanso_icon.py
      - .github/workflows/apply-finalize-respanso.yml

permissions:
  contents: read

concurrency:
  group: finalize-respanso
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/finalize_patch_a.py
          python scripts/finalize_patch_b.py
          python scripts/generate_respanso_icon.py
          cargo fmt --all
          cargo metadata --format-version 1 | Out-Null

      - name: Assemble final source payload
        shell: pwsh
        run: |
          $root = "target/finalization"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $files = @(
            "README.md",
            "Cargo.lock",
            ".github/workflows/build-respanso-windows.yml",
            "assets/respanso.ico",
            "espanso/Cargo.toml",
            "espanso/build.rs",
            "espanso-editor/Cargo.toml",
            "espanso-editor/build.rs",
            "espanso-editor/src/app.rs",
            "espanso-editor/src/config_transfer.rs",
            "espanso-editor/src/diagnostics.rs",
            "espanso-editor/src/file_monitor.rs",
            "espanso-editor/src/lib.rs",
            "espanso-editor/src/storm_logo.rs",
            "scripts/build_windows_native_portable_with_studio.ps1"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -Path $file -PathType Leaf)) {
              throw "Final source file is missing: $file"
            }
            $target = Join-Path $root $file
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $file $target -Force
          }

      - name: Upload final source payload
        uses: actions/upload-artifact@v4
        with:
          name: respanso-final-source-${{ github.sha }}
          path: target/finalization
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
