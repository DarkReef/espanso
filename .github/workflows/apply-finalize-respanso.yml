name: Apply final rEspanso polish

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - scripts/finalize_patch_a.py
      - scripts/finalize_patch_b.py
      - scripts/generate_respanso_icon.py
      - .github/workflows/apply-finalize-respanso.yml

permissions:
  contents: write

concurrency:
  group: finalize-respanso
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and format final source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/finalize_patch_a.py
          python scripts/finalize_patch_b.py
          python scripts/generate_respanso_icon.py
          cargo fmt --all
          cargo metadata --format-version 1 | Out-Null

          # GITHUB_TOKEN cannot push modifications to workflow files. The final
          # Windows workflow is applied separately through the GitHub connector.
          git checkout -- .github/workflows/build-respanso-windows.yml
          Remove-Item -Force scripts/finalize_patch_a.py
          Remove-Item -Force scripts/finalize_patch_b.py
          Remove-Item -Force scripts/generate_respanso_icon.py

      - name: Commit final source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize rEspanso"
          git push origin HEAD:feature/finalize-respanso
