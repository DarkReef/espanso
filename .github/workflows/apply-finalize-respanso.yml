name: Apply final rEspanso polish

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - scripts/finalize_patch_c.py
      - .github/workflows/apply-finalize-respanso.yml

permissions:
  contents: write

concurrency:
  group: finalize-respanso
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/finalize-respanso
          fetch-depth: 1

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply final consistency patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/finalize_patch_c.py
          cargo fmt --all
          Remove-Item -Force scripts/finalize_patch_c.py

      - name: Commit final consistency patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Rhai saves and external reloads consistent"
          git push origin HEAD:feature/finalize-respanso
