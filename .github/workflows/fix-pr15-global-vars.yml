name: Fix PR15 global vars sequence

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  fix-global-vars:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch global variable parser and renderer
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path("espanso-editor/src/global_variables.rs")
          text = path.read_text(encoding="utf-8")

          old_import = "use serde::{Deserialize, Serialize};"
          new_import = "use serde::{Deserialize, Deserializer, Serialize};"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit("serde import anchor not found")
              text = text.replace(old_import, new_import, 1)

          old_attribute = '    #[serde(default)]\n    global_vars: Vec<StoredVariable>,'
          new_attribute = (
              '    #[serde(default, deserialize_with = "deserialize_global_vars")]\n'
              '    global_vars: Vec<StoredVariable>,'
          )
          if "deserialize_with = \"deserialize_global_vars\"" not in text:
              if old_attribute not in text:
                  raise SystemExit("GlobalVarsHolder anchor not found")
              text = text.replace(old_attribute, new_attribute, 1)

          if "enum StoredVariables" not in text:
              parse_anchor = "fn parse_holder(content: &str) -> Result<GlobalVarsHolder, String> {"
              if parse_anchor not in text:
                  raise SystemExit("parse_holder anchor not found")
              deserialize_block = dedent('''
                  #[derive(Debug, Deserialize)]
                  #[serde(untagged)]
                  enum StoredVariables {
                      Sequence(Vec<StoredVariable>),
                      Single(StoredVariable),
                  }

                  fn deserialize_global_vars<'de, D>(
                      deserializer: D,
                  ) -> Result<Vec<StoredVariable>, D::Error>
                  where
                      D: Deserializer<'de>,
                  {
                      Ok(match Option::<StoredVariables>::deserialize(deserializer)? {
                          Some(StoredVariables::Sequence(variables)) => variables,
                          Some(StoredVariables::Single(variable)) => vec![variable],
                          None => Vec::new(),
                      })
                  }

              ''')
              text = text.replace(parse_anchor, deserialize_block + parse_anchor, 1)

          old_render_lines = (
              '        for line in rendered.lines() {\n'
              '            result.push_str("  ");'
          )
          new_render_lines = (
              '        for (index, line) in rendered.lines().enumerate() {\n'
              '            result.push_str(if index == 0 { "  - " } else { "    " });'
          )
          if "for (index, line) in rendered.lines().enumerate()" not in text:
              if old_render_lines not in text:
                  raise SystemExit("render_global_vars anchor not found")
              text = text.replace(old_render_lines, new_render_lines, 1)

          if "renders_new_string_as_sequence_and_adds_it_to_selection_pool" not in text:
              extra_tests = dedent(r'''

                  #[test]
                  fn renders_new_string_as_sequence_and_adds_it_to_selection_pool() {
                      let source = "matches: []\n";
                      let definition = VariableDefinition {
                          name: "doc".to_owned(),
                          variable_type: "string".to_owned(),
                          params_yaml: "Куцин Иван Юрьевич".to_owned(),
                      };

                      let (updated, added) = upsert_global_variable(source, None, &definition)
                          .expect("add string variable");
                      assert!(added);
                      assert!(updated.contains("global_vars:\n  - name: doc\n"));

                      let records = list_global_variables(Path::new("match/base.yml"), &updated)
                          .expect("new variable should enter the selection pool");
                      assert_eq!(records.len(), 1);
                      assert_eq!(records[0].definition.name, "doc");
                      assert_eq!(records[0].definition.variable_type, "string");
                      assert_eq!(records[0].definition.params_yaml, "Куцин Иван Юрьевич");
                  }

                  #[test]
                  fn accepts_legacy_single_map_and_rewrites_it_as_sequence() {
                      let source = "global_vars:\n  name: doc\n  type: echo\n  params:\n    echo: Куцин Иван Юрьевич\n\nmatches: []\n";
                      let records = list_global_variables(Path::new("match/base.yml"), source)
                          .expect("legacy map should remain editable and visible");
                      assert_eq!(records.len(), 1);
                      assert_eq!(records[0].definition.name, "doc");

                      let (updated, added) = upsert_global_variable(
                          source,
                          Some("doc"),
                          &records[0].definition,
                      )
                      .expect("normalize legacy map");
                      assert!(!added);
                      assert!(updated.contains("global_vars:\n  - name: doc\n"));
                      assert!(!updated.contains("global_vars:\n  name: doc\n"));
                  }
              ''')
              close = text.rfind("\n}")
              if close == -1:
                  raise SystemExit("tests module closing brace not found")
              text = text[:close] + extra_tests + text[close:]

          path.write_text(text, encoding="utf-8")

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test Match Studio
        run: cargo test -p espanso-editor --lib

      - name: Strict Clippy
        run: cargo clippy -p espanso-editor --all-targets -- --deny warnings

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-pr15-global-vars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/global_variables.rs .github/workflows/fix-pr15-global-vars.yml
          git commit -m "fix(editor): serialize global variables as a YAML sequence"
          git push origin HEAD:feature/manual-build-dynamic-vars
