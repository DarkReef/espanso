name: Fix rEspanso branding placeholders

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: fix-respanso-branding-placeholders
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'rEspanso-feature'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: rEspanso-feature
          fetch-depth: 0

      - name: Restore compatibility identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "__TECH_ESPANSO_EXE__": "espanso.exe",
              "__TECH_ESPANSOD_EXE__": "espansod.exe",
              "__TECH_ESPANSO_CMD__": "espanso.cmd",
              "__TECH_ESPANSO_ORG__": "espanso.org",
              "__TECH_ESPANSO_REPO__": "espanso/espanso",
              "__TECH_ESPANSO_CRATE__": "espanso-",
              "__TECH_ESPANSO_ENV__": "ESPANSO_",
          }

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".ico", ".icns", ".zip",
              ".gz", ".xz", ".woff", ".woff2", ".ttf", ".exe", ".dll",
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              changed = source
              for marker, original in replacements.items():
                  changed = changed.replace(marker, original)
              if changed != source:
                  path.write_text(changed, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Commit restored identifiers
        shell: bash
        run: |
          git restore .github/workflows/fix-branding-placeholders.yml
          git config user.name "rEspanso Branding Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore technical espanso compatibility identifiers"
          git push origin HEAD:rEspanso-feature
