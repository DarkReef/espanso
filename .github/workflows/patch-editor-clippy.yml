name: Temporary Editor Clippy Patch

on:
  pull_request:
    paths:
      - ".github/workflows/patch-editor-clippy.yml"

permissions:
  contents: write

jobs:
  patch-editor-clippy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Apply Clippy semicolon fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("espanso-editor/src/app.rs")
          content = path.read_text()
          replacements = {
              '"Нет изменений для сохранения".clone_into(&mut self.status)\n': '"Нет изменений для сохранения".clone_into(&mut self.status);\n',
              'self.status = format!("Сохранено файлов: {}. Резервные копии созданы", saved.len())\n': 'self.status = format!("Сохранено файлов: {}. Резервные копии созданы", saved.len());\n',
              'self.status = format!("Сохранение остановлено: {}", ru_message(&error.to_string()))\n': 'self.status = format!("Сохранение остановлено: {}", ru_message(&error.to_string()));\n',
              'self.status = format!("YAML отклонён: {}", ru_message(&error.to_string()))\n': 'self.status = format!("YAML отклонён: {}", ru_message(&error.to_string()));\n',
              '                };\n            });\n\n        egui::CollapsingHeader::new("Проверка на примерах")': '                }\n            });\n\n        egui::CollapsingHeader::new("Проверка на примерах")',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"expected fragment not found: {old!r}")
              content = content.replace(old, new, 1)
          path.write_text(content)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs
          git commit -m "fix(editor): satisfy strict Clippy"
          git push origin "HEAD:${{ github.head_ref }}"
