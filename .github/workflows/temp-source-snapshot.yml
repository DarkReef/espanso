name: Temporary source snapshot

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Archive current source
        run: git archive --format=zip --output=respanso-source.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: respanso-source-snapshot
          path: respanso-source.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-source-snapshot.yml
          git commit -m "chore: remove temporary source snapshot workflow"
          git push origin HEAD:feature/manual-build-dynamic-vars
