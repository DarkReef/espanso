name: Temporary Editor Formatter

on:
  pull_request:
    paths:
      - "espanso-editor/src/app.rs"
      - "espanso-editor/src/main.rs"
      - ".github/workflows/format-editor.yml"

permissions:
  contents: write

jobs:
  format-editor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs espanso-editor/src/main.rs
          git commit -m "style(editor): apply rustfmt"
          git push origin "HEAD:${{ github.head_ref }}"
