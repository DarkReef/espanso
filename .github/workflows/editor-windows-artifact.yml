name: Editor Windows focused check

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "Cargo.toml"
      - ".github/workflows/editor-windows-artifact.yml"

jobs:
  windows-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Build editor and check CLI integration
        shell: pwsh
        run: |
          $status = 0
          cargo build -p espanso-editor *>&1 | Tee-Object -FilePath editor-windows.log
          if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          if ($status -eq 0) {
            cargo check -p espanso *>&1 | Tee-Object -FilePath editor-windows.log -Append
            if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          }
          if ($status -eq 0) {
            cargo clippy -p espanso-editor --all-targets -- --deny warnings *>&1 | Tee-Object -FilePath editor-windows.log -Append
            if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          }
          Set-Content -Path editor-windows.status -Value $status
          exit 0
      - name: Upload Windows validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-windows-log
          path: |
            editor-windows.log
            editor-windows.status
          if-no-files-found: error
      - name: Fail when validation failed
        shell: pwsh
        run: |
          if ((Get-Content editor-windows.status) -ne "0") { exit 1 }
