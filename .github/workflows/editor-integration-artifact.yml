name: Editor integration logs

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - "Cargo.toml"
      - ".github/workflows/editor-integration-artifact.yml"

jobs:
  linux-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Install Linux X11 dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: Capture integration clippy
        run: |
          set +e
          cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings 2>&1 | tee editor-integration.log
          echo ${PIPESTATUS[0]} > editor-integration.status
          exit 0
      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-integration-log
          path: |
            editor-integration.log
            editor-integration.status
          if-no-files-found: error
      - name: Fail when clippy failed
        run: test "$(cat editor-integration.status)" = "0"
