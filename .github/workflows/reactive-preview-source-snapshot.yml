name: Snapshot generated reactive preview sources

on:
  pull_request:
    branches:
      - rEspanso-feature
    paths:
      - .github/workflows/reactive-preview-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feature/reactive-rhai-preview
          fetch-depth: 0

      - name: Extract generated reactive implementation
        shell: pwsh
        run: |
          @'
          import base64
          import gzip
          from pathlib import Path
          import re
          import subprocess

          SOURCE_COMMIT = "1eca9078c69c3254d8488a16d5737b175ea56b8e"
          source = subprocess.check_output(
              ["git", "show", f"{SOURCE_COMMIT}:.github/workflows/temp-reactive-rhai-preview.yml"],
              text=True,
              encoding="utf-8",
          )
          match = re.search(
              r"@'\n(?P<data>[A-Za-z0-9+/=]+)\n'@ \| Set-Content -Path reactive_patch\.b64",
              source,
          )
          if not match:
              raise SystemExit("encoded reactive preview patch was not found")

          patch = gzip.decompress(base64.b64decode(match.group("data"))).decode("utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = (
              "updated, count = re.subn("
              "pattern, lambda _match: replacement, text, count=1, flags=flags)"
          )
          if patch.count(old) != 1:
              raise SystemExit("regex replacement helper anchor was not found exactly once")
          patch = patch.replace(old, new, 1)
          Path("reactive_patch.py").write_text(patch, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path extract_reactive_patch.py -Encoding utf8
          python extract_reactive_patch.py
          python reactive_patch.py

      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: reactive-preview-source-snapshot
          path: |
            espanso-render/src/renderer/mod.rs
            espanso-render/src/renderer/util.rs
            espanso-render/src/extension/form.rs
            espanso-modulo/src/form/config.rs
            espanso-modulo/src/form/generator.rs
            espanso-modulo/src/form/mod.rs
            espanso-modulo/src/sys/form/mod.rs
            espanso-modulo/src/sys/form/form.cpp
            espanso-modulo/src/sys/interop/interop.h
            espanso-modulo/src/sys/interop/mod.rs
            espanso/src/cli/modulo/mod.rs
            espanso/src/cli/modulo/form.rs
            espanso/src/cli/modulo/reactive_preview.rs
            espanso/src/cli/worker/engine/process/middleware/render/extension/form.rs
            espanso/src/gui/mod.rs
            espanso/src/gui/modulo/form.rs
            docs/respanso/REACTIVE_RHAI_PREVIEW.ru.md
            docs/respanso/FORM_PREVIEW.ru.md
            examples/medical-calculators/medical-calculators.yml
          if-no-files-found: error
          retention-days: 7
