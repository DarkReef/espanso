name: Temporary complete Russian wizard build

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wizard-full-russian-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  localize-test-build:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Localize every wizard page and dialog
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          GUI_PATH = Path("espanso-modulo/src/sys/wizard/wizard_gui.cpp")
          WIZARD_PATH = Path("espanso-modulo/src/sys/wizard/wizard.cpp")

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8-sig")

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8-sig", newline="\n")

          def add_utf8_support(text: str) -> str:
              pragma = '''#define _UNICODE

          #ifdef _MSC_VER
          #pragma execution_character_set("utf-8")
          #endif
          '''
              if '#pragma execution_character_set("utf-8")' not in text:
                  text = text.replace('#define _UNICODE\n', pragma, 1)
              helper_anchor = '#include "wizard_gui.h"\n'
              helper = '''#include "wizard_gui.h"

          namespace {
          wxString ui_text(const char *text) { return wxString::FromUTF8(text); }
          } // namespace
          '''
              if 'wxString ui_text(const char *text)' not in text:
                  if helper_anchor not in text:
                      raise SystemExit("wizard_gui.cpp helper anchor not found")
                  text = text.replace(helper_anchor, helper, 1)
              return text

          def expression(value: str) -> str:
              escaped = (
                  value.replace('\\', '\\\\')
                  .replace('"', '\\"')
                  .replace('\n', '\\n')
              )
              return f'ui_text("{escaped}")'

          def replace_control_text(source: str, control: str, value: str) -> str:
              control_pos = source.find(control)
              if control_pos < 0:
                  raise SystemExit(f"control not found: {control}")
              default_pos = source.find('wxDefaultPosition', control_pos)
              if default_pos < 0:
                  raise SystemExit(f"wxDefaultPosition not found for: {control}")
              text_pos = source.find('wxT(', control_pos, default_pos)
              if text_pos < 0:
                  current = expression(value)
                  if current in source[control_pos:default_pos]:
                      return source
                  raise SystemExit(f"wxT text not found for: {control}")
              close_pos = source.rfind('),', text_pos, default_pos)
              if close_pos < 0:
                  raise SystemExit(f"closing wxT not found for: {control}")
              return source[:text_pos] + expression(value) + source[close_pos + 1:]

          gui = add_utf8_support(read(GUI_PATH))

          labels = {
              "welcome_title_text": "Добро пожаловать в rEspanso",
              "welcome_version_text": "Версия 1.2.3",
              "welcome_description_text": "rEspanso ускоряет ввод текста с помощью сокращений, шаблонов и локальной автоматизации.\n\nНажмите «Начать», чтобы выполнить первоначальную настройку.",
              "welcome_start_button": "Начать",
              "move_bundle_title": "Переместите rEspanso в папку «Программы»",
              "move_bundle_description": "rEspanso запущен не из системной папки «Программы», поэтому macOS может блокировать его корректную работу.\n\nПереместите rEspanso.app в папку /Applications и запустите приложение снова.",
              "move_bundle_quit_button": "Закрыть",
              "legacy_version_title": "Обнаружена старая версия rEspanso",
              "legacy_version_description": "Запущен процесс старой версии Espanso, который мешает работе rEspanso.\n\nЗавершите старый процесс и удалите прежнюю версию приложения. Если она уже удалена, перезагрузите компьютер, чтобы система обновила состояние.\n\nДополнительная информация:",
              "legacy_version_continue_button": "Продолжить",
              "wrong_edition_title": "Обнаружена несовместимая сборка",
              "wrong_edition_description_x11": "Установленная сборка rEspanso предназначена для X11, но текущий сеанс работает в Wayland.\n\nЭти варианты несовместимы. Переключитесь на сеанс X11 или установите сборку для Wayland.\n\nДополнительная информация:",
              "wrong_edition_description_wayland": "Установленная сборка rEspanso предназначена для Wayland, но текущий сеанс работает в X11.\n\nЭти варианты несовместимы. Переключитесь на сеанс Wayland или установите сборку для X11.\n\nДополнительная информация:",
              "wrong_edition_button": "Закрыть rEspanso",
              "migrate_title": "Перенос конфигурации",
              "migrate_description": "Новая версия использует обновлённый формат конфигурации, необходимый для новых возможностей rEspanso.\n\nВыберите вариант:\n\n• создать резервную копию старой конфигурации в папке «Документы» и автоматически перенести настройки — рекомендуется;\n• продолжить в режиме совместимости без изменения файлов.\n\nРежим совместимости поддерживает не все новые возможности. Перенос можно выполнить позже.\n\nДополнительная информация:",
              "migrate_compatibility_mode_button": "Режим совместимости",
              "migrate_backup_and_migrate_button": "Создать копию и перенести",
              "auto_start_title": "Автозапуск rEspanso",
              "auto_start_description": "rEspanso может автоматически запускаться после входа в систему.\n\nВключить автозапуск?",
              "auto_start_checkbox": "Запускать rEspanso при входе в систему (рекомендуется)",
              "auto_start_note": "Автозапуск можно отключить позже в настройках.",
              "auto_start_continue": "Продолжить",
              "add_path_title": "Команда rEspanso в PATH",
              "add_path_description": "rEspanso предоставляет командную строку для управления приложением и диагностики конфигурации.\n\nДобавление программы в переменную PATH позволит запускать команду espanso из терминала. Добавить rEspanso в PATH?",
              "add_path_checkbox": "Добавить команду espanso в PATH",
              "add_path_note": "Если вы не используете терминал, этот параметр можно оставить включённым.",
              "add_path_continue_button": "Продолжить",
              "accessibility_title": "Разрешение универсального доступа",
              "accessibility_description": "Для распознавания сокращений и вставки текста rEspanso требуется разрешение «Универсальный доступ» в macOS.\n\n1. Нажмите «Открыть настройки».\n2. В системном диалоге выберите «Открыть Системные настройки».",
              "accessibility_description2": "3. Откройте раздел «Конфиденциальность и безопасность» → «Универсальный доступ».\n4. Разрешите доступ для rEspanso, как показано на изображении.",
              "accessibility_enable_button": "Открыть настройки",
          }

          for control, value in labels.items():
              gui = replace_control_text(gui, control, value)

          gui = gui.replace('wxT("a page")', 'ui_text("Страница")')
          write(GUI_PATH, gui)

          wizard = read(WIZARD_PATH)
          if '#pragma execution_character_set("utf-8")' not in wizard:
              wizard = wizard.replace(
                  '#define _UNICODE\n',
                  '#define _UNICODE\n\n#ifdef _MSC_VER\n#pragma execution_character_set("utf-8")\n#endif\n',
                  1,
              )

          helper_anchor = '#include "./wizard_gui.h"\n'
          helper = '''#include "./wizard_gui.h"

          namespace {
          wxString ui_text(const char *text) { return wxString::FromUTF8(text); }
          } // namespace
          '''
          if 'wxString ui_text(const char *text)' not in wizard:
              if helper_anchor not in wizard:
                  raise SystemExit("wizard.cpp helper anchor not found")
              wizard = wizard.replace(helper_anchor, helper, 1)

          wizard = re.sub(
              r'this->welcome_version_text->SetLabel\(.*?\);',
              'this->welcome_version_text->SetLabel(\n        ui_text("Версия ") + wxString::FromUTF8(wizard_metadata->version));',
              wizard,
              count=1,
              flags=re.S,
          )

          def replace_function(source: str, start: str, end: str, body: str) -> str:
              start_pos = source.find(start)
              end_pos = source.find(end, start_pos + len(start))
              if start_pos < 0 or end_pos < 0:
                  raise SystemExit(f"function boundary not found: {start}")
              return source[:start_pos] + body.rstrip() + "\n\n" + source[end_pos:]

          migrate_body = r'''void DerivedFrame::migrate_button_clicked(wxCommandEvent &event) {
              if (wizard_metadata->backup_and_migrate) {
                  int result = wizard_metadata->backup_and_migrate();
                  if (result == MIGRATE_RESULT_SUCCESS) {
                      this->navigate_to_next_page_or_close();
                  } else if (result == MIGRATE_RESULT_CLEAN_FAILURE) {
                      wxMessageBox(
                          ui_text("Не удалось перенести конфигурацию, но исходные файлы не изменены.\n\nПодробности доступны в журнале: espanso log."),
                          ui_text("Ошибка переноса конфигурации"), wxICON_ERROR);
                  } else if (result == MIGRATE_RESULT_DIRTY_FAILURE) {
                      wxMessageBox(
                          ui_text("Не удалось завершить перенос конфигурации. Некоторые файлы могли быть изменены или отсутствовать. Резервная копия сохранена в папке «Документы».\n\nПодробности доступны в журнале: espanso log."),
                          ui_text("Ошибка переноса конфигурации"), wxICON_ERROR);
                  } else if (result == MIGRATE_RESULT_UNKNOWN_FAILURE) {
                      wxMessageBox(
                          ui_text("Во время переноса конфигурации произошла ошибка.\n\nПодробности доступны в журнале: espanso log."),
                          ui_text("Ошибка переноса конфигурации"), wxICON_ERROR);
                  }
              }
          }'''

          auto_start_body = r'''void DerivedFrame::auto_start_continue_clicked(wxCommandEvent &event) {
              if (!auto_start_checkbox->IsChecked()) {
                  if (wizard_metadata->auto_start) {
                      wizard_metadata->auto_start(0);
                  }
                  this->navigate_to_next_page_or_close();
                  return;
              }

              if (wizard_metadata->auto_start) {
                  while (true) {
                      int result = wizard_metadata->auto_start(1);
                      if (result == 1) {
                          this->navigate_to_next_page_or_close();
                          return;
                      }

                      wxMessageDialog dialog(
                          this,
                          ui_text("Не удалось включить автозапуск rEspanso.\n\nПроверьте журнал приложения. Повторить попытку? Этот параметр можно настроить позже."),
                          ui_text("Ошибка автозапуска"),
                          wxCENTER | wxOK_DEFAULT | wxOK | wxCANCEL |
                              wxICON_EXCLAMATION);
                      dialog.SetOKLabel(ui_text("Повторить"));
                      dialog.SetCancelLabel(ui_text("Пропустить"));

                      if (dialog.ShowModal() == wxID_CANCEL) {
                          this->navigate_to_next_page_or_close();
                          break;
                      }
                  }
              }
          }'''

          path_body = r'''void DerivedFrame::add_path_continue_clicked(wxCommandEvent &event) {
              if (!add_path_checkbox->IsChecked()) {
                  this->navigate_to_next_page_or_close();
                  return;
              }

              if (wizard_metadata->add_to_path) {
                  while (true) {
                      int result = wizard_metadata->add_to_path();
                      if (result == 1) {
                          this->navigate_to_next_page_or_close();
                          return;
                      }

                      wxMessageDialog dialog(
                          this,
                          ui_text("Не удалось добавить команду espanso в PATH.\n\nПроверьте журнал приложения. Повторить попытку? PATH можно настроить позже."),
                          ui_text("Ошибка настройки PATH"),
                          wxCENTER | wxOK_DEFAULT | wxOK | wxCANCEL |
                              wxICON_EXCLAMATION);
                      dialog.SetOKLabel(ui_text("Повторить"));
                      dialog.SetCancelLabel(ui_text("Пропустить"));

                      if (dialog.ShowModal() == wxID_CANCEL) {
                          this->navigate_to_next_page_or_close();
                          break;
                      }
                  }
              }
          }'''

          wizard = replace_function(
              wizard,
              'void DerivedFrame::migrate_button_clicked',
              'void DerivedFrame::auto_start_continue_clicked',
              migrate_body,
          )
          wizard = replace_function(
              wizard,
              'void DerivedFrame::auto_start_continue_clicked',
              'void DerivedFrame::add_path_continue_clicked',
              auto_start_body,
          )
          wizard = replace_function(
              wizard,
              'void DerivedFrame::add_path_continue_clicked',
              'void DerivedFrame::accessibility_enable_clicked',
              path_body,
          )
          write(WIZARD_PATH, wizard)
          '@ | python -

      - name: Verify Russian wizard sources
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          gui = Path("espanso-modulo/src/sys/wizard/wizard_gui.cpp").read_text(encoding="utf-8-sig")
          wizard = Path("espanso-modulo/src/sys/wizard/wizard.cpp").read_text(encoding="utf-8-sig")

          forbidden = [
              "Move to /Applications folder",
              "Legacy version detected",
              "Incompatibility detected",
              "Migrate configuration",
              "Use compatibility mode",
              "Backup && Migrate",
              "Launch on System startup",
              "Do you want to proceed",
              "Yes, launch Espanso",
              "Add to PATH",
              "Yes, add espanso",
              "Enable Accessibility",
              "Operation failed",
              "Migration error",
              "Retry",
              "An error occurred",
              "please check the logs",
          ]
          remaining = [text for text in forbidden if text in gui or text in wizard]
          if remaining:
              raise SystemExit(f"Untranslated wizard strings remain: {remaining}")

          if '????' in gui or '????' in wizard or '\ufffd' in gui or '\ufffd' in wizard:
              raise SystemExit("Broken Unicode replacement characters detected")

          for path in [
              Path("espanso-modulo/src/sys/wizard/wizard_gui.cpp"),
              Path("espanso-modulo/src/sys/wizard/wizard.cpp"),
          ]:
              raw = path.read_bytes()
              if not raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f"UTF-8 BOM missing: {path}")

          if gui.count('ui_text(') < 30:
              raise SystemExit("Not all wizard controls were converted to explicit UTF-8")
          if 'dialog.SetCancelLabel(ui_text("Пропустить"))' not in wizard:
              raise SystemExit("Russian dialog buttons are missing")
          '@ | python -

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test runtime binaries
        run: cargo test --locked -p espanso --bins

      - name: Lint runtime binaries
        run: cargo clippy --locked -p espanso --bins -- --deny warnings

      - name: Build release binaries
        run: |
          cargo build --locked --release -p espanso --bin espanso --bin respanso-portable
          cargo build --locked --release -p espanso-editor --bin espanso-editor

      - name: Assemble and verify portable archive
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"
          $archive = "target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip"
          if (-not (Test-Path -Path $archive -PathType Leaf)) {
            throw "Portable archive was not created"
          }
          $entries = tar -tf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive could not be listed"
          }
          foreach ($file in @("rEspanso.exe", "rEspanso-core.exe", "rEspanso Match Studio.exe")) {
            if (-not ($entries -match [regex]::Escape($file))) {
              throw "Portable archive is missing $file"
            }
          }

      - name: Commit verified localization and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/temp-wizard-full-russian.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-modulo/src/sys/wizard/wizard_gui.cpp espanso-modulo/src/sys/wizard/wizard.cpp .github/workflows/temp-wizard-full-russian.yml
          git commit -m "feat(wizard): fully localize setup flow in Russian"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-x64-full-Russian-wizard
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
