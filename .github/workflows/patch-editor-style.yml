name: Temporary Editor Style Patch

on:
  pull_request:
    paths:
      - ".github/workflows/patch-editor-style.yml"

permissions:
  contents: write

jobs:
  patch-editor-style:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.head_ref }}
      - name: Remove incompatible egui style calls
        shell: python
        run: |
          from pathlib import Path
          path = Path("espanso-editor/src/app.rs")
          content = path.read_text()
          old = '''        Box::new(move |creation_context| {
                      let mut style = (*creation_context.egui_ctx.style()).clone();
                      style.spacing.item_spacing = egui::vec2(8.0, 8.0);
                      style.spacing.button_padding = egui::vec2(12.0, 6.0);
                      creation_context.egui_ctx.set_style(style);
                      Ok(Box::new(MatchStudioApp::new(config_root)))
                  }),'''
          if old not in content:
              raise SystemExit("style block not found")
          content = content.replace(
              old,
              '''        Box::new(move |_creation_context| {
                      Ok(Box::new(MatchStudioApp::new(config_root)))
                  }),''',
          )
          path.write_text(content)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs
          git commit -m "fix(editor): use egui 0.35 compatible startup"
          git push origin "HEAD:${{ github.head_ref }}"
