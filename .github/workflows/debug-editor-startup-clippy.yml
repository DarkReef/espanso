name: Temporary Startup Clippy Log

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/debug-editor-startup-clippy.yml"

jobs:
  startup-clippy-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy -p espanso-editor --all-targets -- --deny warnings > startup-clippy.log 2>&1
          status=$?
          echo "$status" > startup-clippy.status
          tail -n 120 startup-clippy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: startup-clippy-log
          path: |
            startup-clippy.log
            startup-clippy.status
          if-no-files-found: error
