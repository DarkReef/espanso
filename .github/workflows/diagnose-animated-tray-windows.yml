name: Diagnose animated tray Windows build

on:
  push:
    branches:
      - feature/animated-tray-config-transfer
    paths:
      - .github/animated-tray-diagnostic-trigger.txt
      - .github/workflows/diagnose-animated-tray-windows.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-tray-config-transfer
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Capture focused Windows failure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo test --quiet -p espanso --bin respanso-portable *>&1 | Tee-Object -FilePath .github/windows-diagnostic.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Add-Content .github/windows-diagnostic.log
          exit 0
      - name: Publish diagnostic log to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/windows-diagnostic.log
          git commit -m "chore: capture Windows tray diagnostic"
          git push origin HEAD:feature/animated-tray-config-transfer
