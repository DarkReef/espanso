name: Nix diagnostics

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: nix-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Capture Wayland Nix build
        id: nix
        shell: bash
        run: |
          set +e
          nix build -L .#espanso-wayland > nix-wayland.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Nix diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nix-wayland-diagnostics-${{ github.sha }}
          path: nix-wayland.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when Nix failed
        if: steps.nix.outputs.status != '0'
        run: exit 1
