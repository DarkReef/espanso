name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-windows-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Capture Windows bindings tree
        run: |
          {
            echo '=== windows 0.61.1 reverse dependencies ==='
            cargo tree --target x86_64-pc-windows-msvc -i windows@0.61.1 || true
            echo
            echo '=== windows 0.62.0 reverse dependencies ==='
            cargo tree --target x86_64-pc-windows-msvc -i windows@0.62.0 || true
            echo
            echo '=== windows-core 0.61.0 reverse dependencies ==='
            cargo tree --target x86_64-pc-windows-msvc -i windows-core@0.61.0 || true
          } > windows-dependency-tree.txt 2>&1
          cat windows-dependency-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-windows-dependency-tree
          path: windows-dependency-tree.txt
          if-no-files-found: error
