name: CI

on:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-windows-lock:
    if: github.head_ref == 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: integrate-studio-portable
          fetch-depth: 0
      - name: Install Studio build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      - name: Resolve aligned Windows dependencies
        run: cargo check -p espanso-editor
      - name: Commit Cargo.lock
        run: |
          git config user.name "rEspanso Dependency Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already aligned"
            exit 0
          fi
          git add Cargo.lock
          git commit -m "fix: align Windows bindings in Cargo.lock"
          git push origin HEAD:integrate-studio-portable
