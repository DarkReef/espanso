name: CI

on:
  pull_request:
    paths-ignore:
      - ".claude/**"
      - ".devcontainer/**"
      - ".github/workflows/nix-build.yml"
      - ".github/workflows/update-flake.yml"
      - ".vscode/**"
      - "docs/**"
      - "images/**"
      - "schemas/**"
      - ".dockerignore"
      - ".editorconfig"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "tarpaulin.toml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate-studio:
    if: github.head_ref == 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: integrate-studio-portable
          fetch-depth: 0
      - name: Install integration dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libxtst-dev
      - name: Copy Studio and apply integration patch
        run: |
          git fetch origin gui-studio
          git checkout origin/gui-studio -- espanso-editor
          python3 scripts/integrate_studio_portable.py
          cargo fmt --all
          cargo check -p espanso -p espanso-editor
          cargo test -p espanso-editor
      - name: Commit integrated source and lockfile
        run: |
          git config user.name "rEspanso Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            Cargo.toml Cargo.lock \
            espanso-editor \
            espanso/src/main.rs \
            espanso/src/cli/edit.rs \
            espanso-engine/src/event/mod.rs \
            espanso-engine/src/process/middleware/context_menu.rs \
            espanso-engine/src/process/middleware/open_config.rs \
            scripts/build_windows_resources.ps1 \
            scripts/build_windows_portable.ps1
          if git diff --cached --quiet; then
            echo "Integration content is already current"
            exit 0
          fi
          git commit -m "feat: integrate Match Studio into rEspanso portable"
          git push origin HEAD:integrate-studio-portable

  linux-x11:
    if: github.head_ref != 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux X11 dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls
      - name: Clippy
        run: cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix fmt
        run: nix fmt -- --check **/*.nix

  linux-wayland:
    if: github.head_ref != 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux wayland dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libxkbcommon-dev \
            wl-clipboard
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls,wayland
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls,wayland
      - name: Clippy
        run: cargo clippy --features=modulo,vendored-tls,wayland -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build .#espanso-wayland

  macos:
    if: github.head_ref != 'integrate-studio-portable'
    runs-on: macos-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build --target aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: |
          cargo clippy --target=aarch64-apple-darwin -- --deny warnings
          cargo clippy --target=x86_64-apple-darwin -- --deny warnings

  windows:
    if: github.head_ref != 'integrate-studio-portable'
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy -- --deny warnings
