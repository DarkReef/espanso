name: CI

on:
  pull_request:
    paths-ignore:
      - ".claude/**"
      - ".devcontainer/**"
      - ".github/workflows/nix-build.yml"
      - ".github/workflows/update-flake.yml"
      - ".vscode/**"
      - "docs/**"
      - "images/**"
      - "schemas/**"
      - ".dockerignore"
      - ".editorconfig"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "tarpaulin.toml"

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux X11 and Studio dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git libdbus-1-dev libssl-dev libwxgtk3.*-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxtst-dev
      - name: Build
        run: cargo build --no-default-features --features modulo,vendored-tls
      - name: Test
        run: cargo test --workspace --exclude espanso-modulo --exclude espanso-ipc --no-default-features --features vendored-tls
      - name: Clippy
        run: cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix fmt
        run: nix fmt -- --check **/*.nix

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux Wayland and Studio dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git libdbus-1-dev libssl-dev libwxgtk3.*-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxtst-dev wl-clipboard
      - name: Build
        run: cargo build --no-default-features --features modulo,vendored-tls,wayland
      - name: Test
        run: cargo test --workspace --exclude espanso-modulo --exclude espanso-ipc --no-default-features --features vendored-tls,wayland
      - name: Clippy
        run: cargo clippy --features=modulo,vendored-tls,wayland -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build .#espanso-wayland

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build --target aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: |
          cargo clippy --target=aarch64-apple-darwin -- --deny warnings
          cargo clippy --target=x86_64-apple-darwin -- --deny warnings

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build rEspanso and Match Studio
        run: cargo build --release -p espanso -p espanso-editor
      - name: Test Match Studio
        run: cargo test -p espanso-editor
      - name: Clippy
        run: cargo clippy -p espanso -p espanso-editor --all-targets -- --deny warnings
      - name: Assemble unified portable package
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_resources.ps1"
          & "./scripts/build_windows_portable.ps1"
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-portable-with-studio-windows-x86_64
          path: target/windows/rEspanso-Win-Portable-with-Studio-x86_64.zip
          if-no-files-found: error
