name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        shell: bash
        run: cargo fmt --all -- --check
      - name: Build rEspanso and Match Studio
        shell: pwsh
        run: |
          cargo build --release -p espanso -p espanso-editor *>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: respanso-windows-build-diagnostic-final
          path: windows-build.log
          if-no-files-found: error
