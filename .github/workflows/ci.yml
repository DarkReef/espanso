name: CI

on:
  pull_request:
    paths-ignore:
      - ".claude/**"
      - ".devcontainer/**"
      - ".github/workflows/nix-build.yml"
      - ".github/workflows/update-flake.yml"
      - ".vscode/**"
      - "docs/**"
      - "images/**"
      - "schemas/**"
      - ".dockerignore"
      - ".editorconfig"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "tarpaulin.toml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-editor-cli-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add Match Studio CLI flag
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("espanso/src/main.rs")
          source = main.read_text()
          old = '''    .subcommand(SubCommand::with_name("edit")
        .about("Shortcut to open the default text editor to edit config files")
        .arg(Arg::with_name("target_file")
            .help(r#"Defaults to "match/base.yml", it contains the relative path of the file you want to edit,
such as 'config/default.yml' or 'match/base.yml'.
For convenience, you can also specify the name directly and Espanso will figure out the path.
For example, specifying 'email' is equivalent to 'match/email.yml'."#))
    )'''
          new = '''    .subcommand(SubCommand::with_name("edit")
        .about("Open config files in a text editor or launch rEspanso Match Studio")
        .arg(Arg::with_name("gui")
            .long("gui")
            .takes_value(false)
            .help("Launch rEspanso Match Studio for the active config root"))
        .arg(Arg::with_name("target_file")
            .help(r#"Defaults to "match/base.yml", it contains the relative path of the file you want to edit,
such as 'config/default.yml' or 'match/base.yml'.
For convenience, you can also specify the name directly and Espanso will figure out the path.
For example, specifying 'email' is equivalent to 'match/email.yml'.
Use '--gui' (or the legacy positional value 'gui') to launch rEspanso Match Studio."#))
    )'''
          if old in source:
              main.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit("edit CLI block not found")

          edit = Path("espanso/src/cli/edit.rs")
          source = edit.read_text()
          old = '''    let target_file = cli_args.value_of("target_file");
    if target_file == Some("gui") {
        return open_match_studio(&paths.config);
    }'''
          new = '''    let target_file = cli_args.value_of("target_file");
    if cli_args.is_present("gui") || target_file == Some("gui") {
        return open_match_studio(&paths.config);
    }'''
          if old in source:
              edit.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit("edit handler block not found")
          PY
          cargo fmt --all
      - name: Commit Match Studio CLI flag
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add espanso/src/main.rs espanso/src/cli/edit.rs
            git commit -m "feat(editor): add espanso edit --gui"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux X11 dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls
      - name: Clippy
        run: cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix fmt
        run: nix fmt -- --check **/*.nix
      # This step fails to find `xcb/xcb.h`
      #
      #  xcb/xcb.h: No such file or directory
      # - name: nix build
      #   run: nix build

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux wayland dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libxkbcommon-dev \
            wl-clipboard
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls,wayland
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls,wayland
      - name: Clippy
        run: cargo clippy --features=modulo,vendored-tls,wayland -- --deny warnings
      # leaving this nix because is quite fast. macOS in the other hand takes
      # an hour to complete
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build .#espanso-wayland

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build --target aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: |
          cargo clippy --target=aarch64-apple-darwin -- --deny warnings
          cargo clippy --target=x86_64-apple-darwin -- --deny warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build
      - name: Clippy
        run: cargo clippy -- --deny warnings
