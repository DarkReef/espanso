name: CI

on:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-windows-lock:
    if: github.head_ref == 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: integrate-studio-portable
          fetch-depth: 0
      - name: Update Windows notification bindings
        run: |
          cargo update -p tauri-winrt-notification@0.7.2 --precise 0.8.1
          cargo tree --target x86_64-pc-windows-msvc -i windows@0.62.0
          if cargo tree --target x86_64-pc-windows-msvc -i windows@0.61.1 > old-windows-tree.txt 2>&1; then
            cat old-windows-tree.txt
            echo "windows 0.61.1 is still present" >&2
            exit 1
          fi
      - name: Commit Cargo.lock
        run: |
          git config user.name "rEspanso Dependency Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already aligned"
            exit 0
          fi
          git commit -m "fix: align Windows notification dependencies"
          git push origin HEAD:integrate-studio-portable
