name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-cargo-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Capture Cargo update result
        run: |
          set +e
          cargo update -p tauri-winrt-notification > cargo-update.log 2>&1
          status=$?
          echo "exit_status=$status" >> cargo-update.log
          cat cargo-update.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: respanso-cargo-update-diagnostic
          path: cargo-update.log
          if-no-files-found: error
