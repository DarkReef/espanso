name: CI

on:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-windows-lock:
    if: github.head_ref == 'integrate-studio-portable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: integrate-studio-portable
          fetch-depth: 0
      - name: Resolve updated Windows notifications
        run: cargo update -p tauri-winrt-notification
      - name: Commit Cargo.lock
        run: |
          git config user.name "rEspanso Dependency Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already aligned"
            exit 0
          fi
          git commit -m "fix: align Windows notification dependencies"
          git push origin HEAD:integrate-studio-portable
