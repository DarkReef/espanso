name: pol_run - Astra Linux 1.7 X11 portable

on:
  push:
    branches:
      - pol_run
    paths:
      - '.github/workflows/pol-run-astra17-x11.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'espanso/**'
      - 'espanso-*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pol-run-astra17-x11
  cancel-in-progress: true

jobs:
  build:
    name: Build X11 for Astra 1.7 / glibc 2.28
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout pol_run
        uses: actions/checkout@v4
        with:
          ref: pol_run
          fetch-depth: 1

      - name: Build inside Debian 10 (buster)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target/pol-run-out

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e CARGO_TERM_COLOR=always \
            debian:buster-slim \
            bash -lc '
              set -euxo pipefail

              # Debian 10 is archived; it gives us glibc 2.28, matching the
              # compatibility ceiling we need for Astra Linux 1.7.
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                > /etc/apt/sources.list
              printf "Acquire::Check-Valid-Until false;\n" > /etc/apt/apt.conf.d/99archive

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                file \
                git \
                libdbus-1-dev \
                libssl-dev \
                libwxgtk3.0-gtk3-dev \
                libx11-dev \
                libxkbcommon-dev \
                libxtst-dev \
                patchelf \
                pkg-config \
                xz-utils

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"

              rustc --version
              cargo --version
              ldd --version | head -n1

              cargo build --locked --release \
                -p espanso --bin espanso \
                --no-default-features \
                --features modulo,vendored-tls

              bin=target/release/espanso
              test -x "$bin"
              file "$bin"

              package=rEspanso-pol_run-Astra17-X11-x86_64
              out=target/pol-run-out
              root="$out/$package"
              rm -rf "$root" "$out/$package.tar.gz" "$out/$package.sha256"
              mkdir -p "$root/lib"

              cp "$bin" "$root/rEspanso-core"
              chmod +x "$root/rEspanso-core"

              # Bundle wxWidgets and the GCC C++ runtime, but deliberately do
              # NOT bundle glibc. The executable itself is linked on Debian 10
              # so it only asks the target system for glibc <= 2.28.
              while read -r soname arrow path rest; do
                case "$soname" in
                  libwx_*.so*|libstdc++.so.6|libgcc_s.so.1)
                    if [ "$arrow" = "=>" ] && [ -f "$path" ]; then
                      cp -L "$path" "$root/lib/$soname"
                    fi
                    ;;
                esac
              done < <(ldd "$bin")

              cat > "$root/run.sh" <<"EOF"
              #!/usr/bin/env bash
              set -e
              ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
              export LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              exec "$ROOT/rEspanso-core" "$@"
              EOF

              cat > "$root/diagnose.sh" <<"EOF"
              #!/usr/bin/env bash
              ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
              export LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              echo "== system =="
              uname -a
              ldd --version | head -n1 || true
              echo
              echo "== bundled libs =="
              ls -l "$ROOT/lib" || true
              echo
              echo "== unresolved =="
              ldd "$ROOT/rEspanso-core" | grep "not found" || echo "none"
              echo
              echo "== rEspanso version =="
              "$ROOT/rEspanso-core" --version || true
              EOF

              cat > "$root/README-POL-RUN.txt" <<"EOF"
              rEspanso pol_run — Astra Linux 1.7 X11 x86_64

              Цель этой сборки: запуск без sudo на рабочей станции Astra Linux 1.7.
              Бинарник собирается в Debian 10 (glibc 2.28), а wxWidgets 3.0 и
              C++ runtime лежат рядом в lib/.

              Запуск:
                chmod +x run.sh diagnose.sh rEspanso-core
                ./run.sh

              Если не запускается:
                ./diagnose.sh

              Системная glibc намеренно не упакована и не подменяется.
              EOF

              chmod +x "$root/run.sh" "$root/diagnose.sh"

              echo "== build ldd ==" > "$root/BUILD-LINKED-LIBRARIES.txt"
              ldd "$bin" >> "$root/BUILD-LINKED-LIBRARIES.txt"

              echo "== required GLIBC symbols ==" > "$root/BUILD-ABI.txt"
              objdump -T "$bin" 2>/dev/null \
                | grep -o "GLIBC_[0-9.]*" \
                | sort -Vu >> "$root/BUILD-ABI.txt" || true
              echo >> "$root/BUILD-ABI.txt"
              echo "== required GLIBCXX symbols from bundled libstdc++ ==" >> "$root/BUILD-ABI.txt"
              if [ -f "$root/lib/libstdc++.so.6" ]; then
                strings "$root/lib/libstdc++.so.6" \
                  | grep "^GLIBCXX_[0-9.]" \
                  | sort -Vu \
                  | tail -n 20 >> "$root/BUILD-ABI.txt" || true
              fi

              # Hard guard: nothing newer than glibc 2.28 may leak into the core.
              max_glibc=$(objdump -T "$bin" 2>/dev/null \
                | grep -o "GLIBC_[0-9.]*" \
                | sed "s/GLIBC_//" \
                | sort -V \
                | tail -n1)
              echo "max required GLIBC: $max_glibc"
              if [ "$(printf "%s\n%s\n" "$max_glibc" "2.28" | sort -V | tail -n1)" != "2.28" ]; then
                echo "ERROR: binary requires GLIBC newer than 2.28"
                exit 1
              fi

              # Validate that bundled wx/C++ libs are picked up by our launcher.
              LD_LIBRARY_PATH="$root/lib" ldd "$root/rEspanso-core" \
                > "$root/PACKAGED-LDD.txt"
              if grep -q "not found" "$root/PACKAGED-LDD.txt"; then
                cat "$root/PACKAGED-LDD.txt"
                echo "ERROR: package still has unresolved libraries in Debian 10 build environment"
                exit 1
              fi

              tar -C "$out" -czf "$out/$package.tar.gz" "$package"
              sha256sum "$out/$package.tar.gz" > "$out/$package.sha256"
              ls -lh "$out/$package.tar.gz" "$out/$package.sha256"
            '

      - name: Inspect package metadata
        shell: bash
        run: |
          set -euxo pipefail
          cat target/pol-run-out/rEspanso-pol_run-Astra17-X11-x86_64/BUILD-ABI.txt
          cat target/pol-run-out/rEspanso-pol_run-Astra17-X11-x86_64/PACKAGED-LDD.txt
          tar -tzf target/pol-run-out/rEspanso-pol_run-Astra17-X11-x86_64.tar.gz | head -n 50

      - name: Upload Astra portable build
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-pol_run-Astra17-X11-x86_64
          path: |
            target/pol-run-out/rEspanso-pol_run-Astra17-X11-x86_64.tar.gz
            target/pol-run-out/rEspanso-pol_run-Astra17-X11-x86_64.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
