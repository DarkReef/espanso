name: Repair portable error dialog

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-runtime-patch-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Replace windows crate MessageBox with direct Win32 FFI
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/apply_runtime_stability_branding_patch.py")
          text = path.read_text(encoding="utf-8")
          old = r'''#[cfg(target_os = "windows")]
          fn show_error_message(message: &str) {
              use windows::core::PCWSTR;
              use windows::Win32::UI::WindowsAndMessaging::{MessageBoxW, MB_ICONERROR, MB_OK};

              let title = "rEspanso\0".encode_utf16().collect::<Vec<_>>();
              let message = format!("{message}\0").encode_utf16().collect::<Vec<_>>();
              unsafe {
                  let _ = MessageBoxW(
                      None,
                      PCWSTR(message.as_ptr()),
                      PCWSTR(title.as_ptr()),
                      MB_OK | MB_ICONERROR,
                  );
              }
          }
          '''
          new = r'''#[cfg(target_os = "windows")]
          fn show_error_message(message: &str) {
              use std::ffi::c_void;

              const MB_OK: u32 = 0;
              const MB_ICONERROR: u32 = 0x10;

              #[link(name = "user32")]
              unsafe extern "system" {
                  fn MessageBoxW(
                      window: *mut c_void,
                      text: *const u16,
                      caption: *const u16,
                      kind: u32,
                  ) -> i32;
              }

              let title = "rEspanso\0".encode_utf16().collect::<Vec<_>>();
              let message = format!("{message}\0").encode_utf16().collect::<Vec<_>>();
              unsafe {
                  let _ = MessageBoxW(
                      std::ptr::null_mut(),
                      message.as_ptr(),
                      title.as_ptr(),
                      MB_OK | MB_ICONERROR,
                  );
              }
          }
          '''
          if old not in text:
              raise SystemExit("portable MessageBox block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | Set-Content -Path repair_patch.py -Encoding utf8NoBOM
          python repair_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to repair portable MessageBox" }
          Remove-Item repair_patch.py -Force
          python -m py_compile scripts/apply_runtime_stability_branding_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Patch script does not compile" }

      - name: Remove repair workflow and commit
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/repair-runtime-patch-v4.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair portable error dialog"
          git push origin HEAD:feature/manual-build-dynamic-vars
