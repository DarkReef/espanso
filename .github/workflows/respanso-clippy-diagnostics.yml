name: rEspanso Clippy diagnostics

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: respanso-clippy-diagnostics
  cancel-in-progress: true

jobs:
  clippy-diagnostics:
    if: github.head_ref == 'rEspanso-feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings > clippy.log 2>&1
          echo $? > clippy-exit-code.txt
          cat clippy.log
          exit 0
      - name: Upload Clippy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: respanso-clippy-diagnostics-${{ github.sha }}
          path: |
            clippy.log
            clippy-exit-code.txt
          retention-days: 7
