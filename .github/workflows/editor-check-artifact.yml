name: Editor clippy fixes

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/editor-check-artifact.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply strict clippy fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path("espanso-editor/src/app.rs")
          source = app.read_text()
          source, count = re.subn(
              r'self\.status = ("(?:[^"\\]|\\.)*")\.to_owned\(\);',
              r'\1.clone_into(&mut self.status);',
              source,
          )
          if count != 9:
              raise SystemExit(f"expected 9 status assignments, replaced {count}")
          old = 'Ok(saved) if saved.is_empty() => self.status = "Nothing to save".to_owned(),'
          new = 'Ok(saved) if saved.is_empty() => "Nothing to save".clone_into(&mut self.status),'
          if old not in source:
              raise SystemExit("missing empty-save assignment")
          app.write_text(source.replace(old, new))

          workspace = Path("espanso-editor/src/workspace.rs")
          source = workspace.read_text()
          replacements = {
              'use std::io::Write;': 'use std::fmt::Write as _;\nuse std::io::Write;',
              '.map(|entry| entry.into_path())': '.map(walkdir::DirEntry::into_path)',
              '.any(|trigger| trigger.is_empty())': '.any(String::is_empty)',
              'result.push_str(&format!("({})", spec.capture_pattern));': 'let _ = write!(result, "({})", spec.capture_pattern);',
              'result.push_str(&format!(\n                "(?P<{}>{})",\n                spec.capture_name, spec.capture_pattern\n            ));': 'let _ = write!(\n                result,\n                "(?P<{}>{})",\n                spec.capture_name, spec.capture_pattern\n            );',
              "trim_end_matches(|character| character == '\\r' || character == '\\n')": "trim_end_matches(['\\r', '\\n'])",
          }
          for old, new in replacements.items():
              occurrences = source.count(old)
              expected = 2 if old.startswith("trim_end_matches") else 1
              if occurrences != expected:
                  raise SystemExit(f"expected {expected} occurrence(s) of {old!r}, found {occurrences}")
              source = source.replace(old, new)
          workspace.write_text(source)
          PY
          cargo fmt --all
      - name: Commit clippy fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs espanso-editor/src/workspace.rs
          git commit -m "fix(editor): satisfy strict workspace clippy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
