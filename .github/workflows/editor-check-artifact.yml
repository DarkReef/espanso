name: Editor panel API fix

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - ".github/workflows/editor-check-artifact.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix Panel sizing API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("espanso-editor/src/app.rs")
          source = path.read_text()
          expected = source.count(".default_width(330.0)")
          if expected != 2:
              raise SystemExit(f"expected two default_width calls, found {expected}")
          path.write_text(source.replace(".default_width(330.0)", ".default_size(330.0)"))
          PY
          cargo fmt --all
      - name: Commit Panel API fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs
          git commit -m "fix(editor): use Panel default_size API"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
