name: Editor focused check

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - "Cargo.toml"
      - ".github/workflows/editor-check-artifact.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Validate editor
        run: |
          set +e
          status=0
          cargo check -p espanso-editor 2>&1 | tee editor-check.log
          check_status=${PIPESTATUS[0]}
          if [ "$check_status" -ne 0 ]; then
            status=$check_status
          else
            cargo test -p espanso-editor 2>&1 | tee -a editor-check.log
            test_status=${PIPESTATUS[0]}
            if [ "$test_status" -ne 0 ]; then
              status=$test_status
            fi
            cargo clippy -p espanso-editor --all-targets -- --deny warnings 2>&1 | tee -a editor-check.log
            clippy_status=${PIPESTATUS[0]}
            if [ "$clippy_status" -ne 0 ]; then
              status=$clippy_status
            fi
          fi
          echo "$status" > editor-check.status
          exit 0
      - name: Upload editor check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-check-log
          path: |
            editor-check.log
            editor-check.status
          if-no-files-found: error
      - name: Fail when validation failed
        run: test "$(cat editor-check.status)" = "0"
