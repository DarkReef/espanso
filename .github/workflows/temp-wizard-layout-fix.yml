name: Temporary wizard encoding and layout fix

on:
  pull_request:
    branches: [rEspanso-feature]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wizard-layout-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-build:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Patch wizard encoding and welcome layout
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"{label} anchor not found")

          gui_path = Path("espanso-modulo/src/sys/wizard/wizard_gui.cpp")
          gui = gui_path.read_text(encoding="utf-8-sig")

          gui = replace_once(
              gui,
              '''    m_scrolledWindow2 =
                  new wxScrolledWindow(welcome_panel, wxID_ANY, wxDefaultPosition,
                                       wxDefaultSize, wxHSCROLL | wxVSCROLL);
              m_scrolledWindow2->SetScrollRate(5, 5);''',
              '''    m_scrolledWindow2 =
                  new wxScrolledWindow(welcome_panel, wxID_ANY, wxDefaultPosition,
                                       wxDefaultSize, wxTAB_TRAVERSAL);
              m_scrolledWindow2->SetScrollRate(0, 0);''',
              "welcome scroll container",
          )
          gui = replace_once(
              gui,
              '''    welcome_image =
                  new wxStaticBitmap(m_scrolledWindow2, wxID_ANY, wxNullBitmap,
                                     wxDefaultPosition, wxSize(256, 256), 0);
              welcome_image->SetMinSize(wxSize(256, 256));''',
              '''    welcome_image =
                  new wxStaticBitmap(m_scrolledWindow2, wxID_ANY, wxNullBitmap,
                                     wxDefaultPosition, wxSize(160, 160), 0);
              welcome_image->SetMinSize(wxSize(160, 160));''',
              "welcome image placeholder",
          )
          gui = replace_once(
              gui,
              "    bSizer2->Add(welcome_title_text, 0, wxALIGN_CENTER_HORIZONTAL | wxTOP, 20);",
              "    bSizer2->Add(welcome_title_text, 0, wxALIGN_CENTER_HORIZONTAL | wxTOP, 12);",
              "welcome title spacing",
          )
          gui = replace_once(
              gui,
              "    welcome_description_text->Wrap(-1);",
              "    welcome_description_text->Wrap(500);",
              "welcome description wrapping",
          )
          gui = replace_once(
              gui,
              "    bSizer2->Fit(m_scrolledWindow2);\n",
              "",
              "welcome forced fit",
          )
          gui_path.write_text(gui, encoding="utf-8-sig", newline="\n")

          wizard_path = Path("espanso-modulo/src/sys/wizard/wizard.cpp")
          wizard = wizard_path.read_text(encoding="utf-8-sig")
          if "#include <algorithm>\n" not in wizard:
              wizard = replace_once(
                  wizard,
                  "#include <memory>\n",
                  "#include <algorithm>\n#include <memory>\n",
                  "algorithm include",
              )

          old_image = '''    if (wizard_metadata->welcome_image_path) {
                  wxBitmap welcomeBitmap =
                      wxBitmap(wxString::FromUTF8(wizard_metadata->welcome_image_path),
                               wxBITMAP_TYPE_PNG);
                  this->welcome_image->SetBitmap(welcomeBitmap);
              }'''
          new_image = '''    if (wizard_metadata->welcome_image_path) {
                  wxImage welcomeImage(
                      wxString::FromUTF8(wizard_metadata->welcome_image_path),
                      wxBITMAP_TYPE_PNG);
                  if (welcomeImage.IsOk()) {
                      constexpr int kWelcomeImageMaxWidth = 160;
                      constexpr int kWelcomeImageMaxHeight = 160;
                      const int sourceWidth = welcomeImage.GetWidth();
                      const int sourceHeight = welcomeImage.GetHeight();

                      if (sourceWidth > kWelcomeImageMaxWidth ||
                          sourceHeight > kWelcomeImageMaxHeight) {
                          const double widthScale =
                              static_cast<double>(kWelcomeImageMaxWidth) / sourceWidth;
                          const double heightScale =
                              static_cast<double>(kWelcomeImageMaxHeight) / sourceHeight;
                          const double scale = std::min(widthScale, heightScale);
                          welcomeImage.Rescale(
                              std::max(1, static_cast<int>(sourceWidth * scale)),
                              std::max(1, static_cast<int>(sourceHeight * scale)),
                              wxIMAGE_QUALITY_HIGH);
                      }

                      this->welcome_image->SetBitmap(wxBitmap(welcomeImage));
                  } else {
                      this->welcome_image->Hide();
                  }
              } else {
                  this->welcome_image->Hide();
              }'''
          wizard = replace_once(wizard, old_image, new_image, "welcome image loader")
          wizard = replace_once(
              wizard,
              '''    this->welcome_version_text->SetLabel(
                  wxString::Format("Версия %s", wizard_metadata->version));''',
              '''    this->welcome_version_text->SetLabel(
                  wxString::FromUTF8("Версия ") +
                  wxString::FromUTF8(wizard_metadata->version));
              this->welcome_panel->Layout();''',
              "welcome version label",
          )
          wizard_path.write_text(wizard, encoding="utf-8-sig", newline="\n")
          '@ | python -

      - name: Validate and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p espanso --bins
          cargo clippy --locked -p espanso --bins -- --deny warnings
          cargo build --locked --release -p espanso --bin espanso --bin respanso-portable
          cargo build --locked --release -p espanso-editor --bin espanso-editor

      - name: Assemble portable archive
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"
          $archive = "target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip"
          if (-not (Test-Path $archive)) { throw "Portable archive was not created" }
          $entries = tar -tf $archive
          if ($entries -match '\.(bat|cmd)$') { throw "Archive contains BAT/CMD launchers" }
          foreach ($file in @("rEspanso.exe", "rEspanso-core.exe", "rEspanso Match Studio.exe")) {
            if (-not ($entries -match [regex]::Escape($file))) { throw "Archive is missing $file" }
          }

      - name: Commit verified fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/temp-wizard-layout-fix.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(wizard): preserve Cyrillic and constrain welcome artwork"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-x64-wizard-layout-fix
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
