name: Refactor PR15 technical audit

on:
  pull_request:
    branches:
      - rEspanso-feature
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: refactor-pr15-technical-audit
  cancel-in-progress: true

jobs:
  refactor-test-build:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-portable
          cache-on-failure: true

      - name: Apply audited refactor
        run: python scripts/refactor_pr15_audit.py

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test Match Studio
        run: cargo test --locked -p espanso-editor --lib

      - name: Strict Clippy
        run: cargo clippy --locked -p espanso-editor --all-targets -- --deny warnings

      - name: Build rEspanso core and launcher
        run: cargo build --locked --release -p espanso --bin espanso --bin respanso-portable

      - name: Build Match Studio
        run: cargo build --locked --release -p espanso-editor --bin espanso-editor

      - name: Assemble and verify portable archive
        shell: pwsh
        run: |
          $env:EXEC_PATH = (Resolve-Path "target/release/espanso.exe").Path
          $env:LAUNCHER_PATH = (Resolve-Path "target/release/respanso-portable.exe").Path
          $env:EDITOR_PATH = (Resolve-Path "target/release/espanso-editor.exe").Path
          & "./scripts/build_windows_native_portable_with_studio.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Portable packaging failed with exit code $LASTEXITCODE"
          }

          $archive = "target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip"
          if (-not (Test-Path -Path $archive -PathType Leaf)) {
            throw "Portable archive was not created"
          }
          $entries = tar -tf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive could not be listed"
          }
          if ($entries -match '\.(bat|cmd)$') {
            throw "Portable archive contains BAT/CMD launchers"
          }
          foreach ($file in @("rEspanso.exe", "rEspanso-core.exe", "rEspanso Match Studio.exe")) {
            if (-not ($entries -match [regex]::Escape($file))) {
              throw "Portable archive is missing $file"
            }
          }

      - name: Commit audited refactor and remove temporary automation
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/refactor-pr15-technical-audit.yml"
          Remove-Item "scripts/refactor_pr15_audit.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs `
            espanso-editor/src/dynamic_variables.rs `
            espanso-editor/src/lib.rs `
            espanso-editor/src/trigger_conversion.rs `
            espanso-editor/src/yaml_files.rs `
            docs/respanso/TECHNICAL_AUDIT_2026-07-31.ru.md `
            scripts/refactor_pr15_audit.py `
            .github/workflows/refactor-pr15-technical-audit.yml
          git diff --cached --stat
          git commit -m "refactor(editor): harden YAML operations and isolate services"
          git push origin HEAD:feature/manual-build-dynamic-vars

      - name: Upload audited portable archive
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-Windows-x64-portable-audited
          path: target/windows/rEspanso-Native-Portable-with-Studio-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rEspanso-technical-audit-failure
          path: |
            target/build-logs/
            target/package-logs/
          if-no-files-found: warn
          retention-days: 3
