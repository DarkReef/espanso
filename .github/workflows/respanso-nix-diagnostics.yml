name: rEspanso Nix diagnostics

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: respanso-nix-diagnostics
  cancel-in-progress: true

jobs:
  nix-diagnostics:
    if: github.head_ref == 'rEspanso-feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Capture Nix build output
        shell: bash
        run: |
          set +e
          nix build .#espanso-wayland --print-build-logs > nix-build.log 2>&1
          echo $? > nix-exit-code.txt
          cat nix-build.log
          exit 0
      - name: Upload Nix diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: respanso-nix-diagnostics-${{ github.sha }}
          path: |
            nix-build.log
            nix-exit-code.txt
          retention-days: 7
