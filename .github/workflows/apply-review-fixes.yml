name: Apply review correctness fixes

on:
  push:
    branches:
      - fix/portable-layout-watcher
    paths:
      - scripts/apply_review_fixes.py
      - .github/workflows/apply-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/portable-layout-watcher
          fetch-depth: 1

      - name: Apply correctness fixes
        run: python scripts/apply_review_fixes.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit corrected source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanso-editor/src/app.rs espanso-editor/src/main.rs
          git commit -m "fix: preserve external settings and normalize bundle root"
          git push origin HEAD:fix/portable-layout-watcher
