name: Editor auto-format

on:
  pull_request:
    paths:
      - "espanso-editor/**"
      - "espanso/src/cli/edit.rs"
      - ".github/workflows/editor-format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add espanso-editor/src espanso/src/cli/edit.rs
            git commit -m "chore(editor): apply rustfmt"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
