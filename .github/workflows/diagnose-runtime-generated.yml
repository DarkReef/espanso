name: Diagnose generated runtime source

on:
  pull_request:
    branches:
      - rEspanso-feature
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: diagnose-runtime-generated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/manual-build-dynamic-vars'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-build-dynamic-vars

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply known Clippy adjustments to patch generator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("scripts/apply_runtime_stability_branding_patch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              ".map_or(0, |duration| duration.as_secs());",
              ".map_or_else(|_| 0, |duration| duration.as_secs());",
          )
          text = text.replace(
              "fn daemon_main(args: CliModuleArgs) -> i32 {",
              "#[allow(clippy::too_many_lines, clippy::collapsible_match)]\nfn daemon_main(args: CliModuleArgs) -> i32 {",
          )
          text = text.replace(
              "fn debouncer_main(\n",
              "#[allow(clippy::too_many_lines)]\nfn debouncer_main(\n",
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content diagnose_edit.py -Encoding utf8NoBOM
          python diagnose_edit.py
          python scripts/apply_runtime_stability_branding_patch.py
          cargo fmt --all

      - name: Print generated daemon source with line numbers
        shell: pwsh
        run: |
          $lines = Get-Content "espanso/src/cli/daemon/mod.rs"
          for ($i = 220; $i -le [Math]::Min(285, $lines.Count); $i++) {
            "{0,4}: {1}" -f $i, $lines[$i - 1]
          }

      - name: Run strict runtime Clippy
        run: cargo clippy --locked -p espanso --bins -- --deny warnings
