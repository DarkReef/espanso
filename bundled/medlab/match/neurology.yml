# Неврология и болевой синдром
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: ".остео_поп"
    replace: "Остеохондроз поясничного отдела позвоночника, болевой синдром вне обострения."

  - trigger: ".остео_поп"
    replace: "Остеохондроз поясничного отдела позвоночника, обострение болевого синдрома (2-3 баллов по ВАШ)."

  - trigger: ".остео_гоп"
    replace: "Остеохондроз грудного отдела позвоночника, болевой синдром вне обострения."

  - trigger: ".остео_гоп"
    replace: "Остеохондроз грудного отдела позвоночника, обострение болевого синдрома (2-3 баллов по ВАШ)."

  - trigger: ".остео_шоп"
    replace: "Остеохондроз шейного отдела позвоночника, болевой синдром вне обострения."

  - trigger: ".остео_шоп"
    replace: "Остеохондроз шейного отдела позвоночника, обострение болевого синдрома (2-3 баллов по ВАШ)."

  - trigger: ".тонический"
    replace: "Мышечно-тонический синдром. "

  - trigger: ":neuro"
    replace: "Status neurologicus:\nОбщемозговых и менингеальных (Брудзинского, Кернига) знаков нет. Обе половины лица симметричны. Язык по центру, нарушений глотания нет. Ригидность затылочных мышц отсутствует. Патологических знаков нет, походка не нарушена. Сухожильные рефлексы OS=DS, отмечается гиперрефлексия коленного рефлекса с обеих сторон. Зрачки OS=OD, фотореакция зрачков сохранена. В позе Ромберга устойчив. Пальценосовая, коленно-пяточная проба - выполняет успешно. Двигательная сфера: атрофий, гипертрофий, фасцикулярных подергиваний нет. Параличей, парезов нет. Тремора конечностей нет. Чувствительность: болевая, тактильная чувствительность сохранена, в пределах нормы."

  - trigger: ":anal"
    replace: "Tabl. Naproxeni 0,55 по 1 таблетке на прием при боли, но не более 3 таблеток в сутки на 7 дней.\nTabl. Tolperizoni 0,45 по 1 таблетке 1 раза в день в течение 7 дней.\nOmeprazoli 0,02 in caps. по 1 таблетке за 30 минут до еды утром в течение 14 дней."

  - trigger: ":anal"
    replace: "Tabl. Naproxeni 0,55 по 1 таблетке на прием при боли, но не более 3 таблеток в сутки на 7 дней.\nTabl. Cyclobenzaprini 0,005 по 1 таблетке 3 раза в день в течение 7 дней.\nOmeprazoli 0,02 in caps. по 1 таблетке за 30 минут до еды утром в течение 14 дней."

  - trigger: ":anal"
    replace: "Анальгезирующая терапия: напроксен 550 мг по 1 таблетке на прием при боли, но не более 2 таблеток в сутки на 5-7 дней.\nГастропротективная терапия: омепразол 20  мг по 1 капсуле на прием утром за полчаса до завтрака на 14 дней."

  - trigger: ":anal"
    replace: "Анальгезирующая терапия:\n(выписан рецепт ф. 148-1/у-88 №...)\nGabapentini 0,3 mg\nD.t.d. №56 in caps.\nSigna: По схеме титрации до наступления клинического эффекта: 1-й день — 300 мг 1 р/сут; 2-й день — 300 мг 2 р/сут; 3-й день — 300 мг 3 р/сут; далее при необходимости постепенное увеличение дозы до максимальной дозы до 3600 мг/сут (в 3 приёма) под контролем рСКФ."

  - trigger: ":anal"
    replace: "Анальгезирующая терапия:\n(выписан рецепт ф. 148-1/у-88 №...)\nTramadoli 0,05 mg\nD.t.d №20 in tab.\n По 1 таблетке на прием внутрь при боли 1 раз в сутки на 20 дней."

  - trigger: ":anal"
    replace: "Анальгезирующая терапия: кеторолак 10 мг по 1 таблетке на прием при боли, но не более 4 таблеток в сутки на 5-7 дней.\nГастропротективная терапия: омепразол 20  мг по 1 капсуле на прием утром за полчаса до завтрака на 14 дней."
