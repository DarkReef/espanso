# Кардиология
# Комплексный триггер .фп расположен в match/atrial-fibrillation.yml.
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: ":ad"
    replace: "Целевые уровни артериального давления достигнуты. "

  - trigger: ":nad"
    replace: "Целевые уровни артериального давления не достигнуты. "

  - regex: ":prestans(?P<Aml>\\d{1,2})\\+(?P<Per>\\d{1,2})\\s"
    replace: "Рекомендованная схема антигипертензивной терапии: амлодипин {{Aml}} мг + периндоприл {{Per}} мг по 1 таблетке на приём утром в фиксированной комбинации."

  - regex: ":gb(?P<stad>\\d{1,1})_ad"
    replace: "Гипертоническая болезнь, стадия {{stad}}, достижение целевых уровней артериального давления, риск "

  - regex: ":gb(?P<stad>\\d{1,1})_nad"
    replace: "Гипертоническая болезнь, стадия {{stad}}, недостижение целевых уровней артериального давления, риск "

  - trigger: ":gb_xz"
    replace: "Гипертоническая болезнь, стадия и риск требуют уточнения, недостижение целевых уровней артериального давления."

  - trigger: ":gb_xz"
    replace: "Гипертоническая болезнь, стадия и риск требуют уточнения, достижение целевых уровней артериального давления."

  - trigger: ":ibs"
    replace: "Ишемическая болезнь сердца. Стенокардия напряжения, ФК I-II."

  - trigger: ":ibs"
    replace: "Ишемическая болезнь сердца. Нестабильная стенокардия."

  - trigger: ":lipid"
    replace: "Гиперлипидемия, тип требует уточнения (вероятно, IIb), целевой уровень ХС ЛПНП требует уточнения."

  - trigger: ":lipid"
    replace: "Гиперлипидемия, тип IIb, целевой уровень ХС ЛПНП менее 1,4 ммоль/л, фактически достигнутый уровень ХС ЛПНП ? ммоль/л от ..."

  - trigger: ":lipid"
    replace: "Гиперлипидемия, тип IIb, целевой уровень ХС ЛПНП менее 1,4 ммоль/л, фактически достигнутый уровень ХС ЛПНП требует уточнения."

  - trigger: ":triplex"
    replace: "Рекомендованная схема антигипертензивной терапии: амлодипин 5 мг + индапамид 1,25 мг + периндоприл 5 мг по 1 таблетке на приём утром в фиксированной комбинации."

  - trigger: ":triplex"
    replace: "Рекомендованная схема антигипертензивной терапии: амлодипин 10 мг + индапамид 2,5 мг + периндоприл 10 мг по 1 таблетке на приём утром в фиксированной комбинации."

  - trigger: ":triplex"
    replace: "Рекомендованная схема антигипертензивной терапии: амлодипин 10 мг + гидрохлортиазид 12,5 мг + телмисартан 80 мг по 1 таблетке на приём утром в фиксированной комбинации."

  - trigger: ":triplex"
    replace: "Рекомендованная схема антигипертензивной терапии: амлодипин 5 мг + гидрохлортиазид 12,5 мг + телмисартан 40 мг по 1 таблетке на приём утром в фиксированной комбинации."

  - regex: ":statin(?P<dose>\\d{1,2})\\s"
    replace: "Гиполипидемическая терапия: Аторвастатин {{dose}} мг по 1 таблетке на утром или вечером. Рекомендован контроль ФПП, ХС ЛПНП через 4-6 недель."

  - regex: ":statin(?P<dose>\\d{1,2})\\s"
    replace: "Гиполипидемическая терапия: Питавастатин {{dose}} мг по 1 таблетке на утром или вечером. Рекомендован контроль ФПП, ХС ЛПНП через 4-6 недель."

  - regex: ":statin(?P<dose>\\d{1,2})\\s"
    replace: "Гиполипидемическая терапия: Розувастатин {{dose}} мг по 1 таблетке на утром или вечером. Рекомендован контроль ФПП, ХС ЛПНП через 4-6 недель."

  - regex: ":bb(?P<dose>\\d{1,2})\\s"
    replace: "Пульс-урежающая терапия: бисопролол {{dose}} мг по 1 таблетке на прием под контролем АД и ЧСС (целевой уровень 55-60 уд/мин)."

  - regex: ":bb(?P<dose>\\d{1,2})\\s"
    replace: "Интенсифцированная пульс-урежающая терапия: бисопролол {{dose}} мг по 1 таблетке на прием утром, ивабрадин 5 мг по 1 таблетке на прием утром под контролем АД и ЧСС (целевой уровень 55-60 уд/мин)."

  - regex: ":bb(?P<dose>\\d{1,2})\\s"
    replace: "Пульс-урежающая терапия: небиволол {{dose}} мг по 1 таблетке на прием под контролем АД и ЧСС (целевой уровень 55-60 уд/мин)."
