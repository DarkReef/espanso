# Эндокринология
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - regex: ".сд2_(?P<key>[0-9]+[,.]?[0-9]*)\\s"
    replace: "Сахарный диабет 2 типа, целевой уровень HbA1c {{key}}%, фактически достигнутый уровень HbA1c требует уточнения."

  - trigger: ":stopi"
    replace: "Осмотр стоп: стопы чистые, кожа стоп сухая, признаков формирования диабетической стопы нет. Чувствительность (вибрационная, тактильная, температурная) стоп не изменена. Пульсация артерий стоп сохранена."

  - trigger: ":met"
    replace: "Пероральные сахароснижающие препараты: метформин 500 мг по 1 таблетке на прием 2 раза в сутки."

  - trigger: ":met"
    replace: "Пероральные сахароснижающие препараты: метформин 1000 мг по 1 таблетке на прием 2 раза в сутки."

  - trigger: ":met"
    replace: "Пероральные сахароснижающие препараты по схеме: метформин пролонгированный 1 таблетка 1 раз в сутки во время ужина 750 мг в сутки в 14 дней. Затем 2 таблетки по 750 мг 1 раз в сутки во время ужина. Каждые 6 месяцев глюкоза плазмы натощак и каждые 12 месяц гликированный гемоглобин."
