# rEspanso calculator window example.
#
# The core only renders the form, passes the values to an embedded Rhai module
# and displays the returned text. Editing the .rhai file does not require a
# compiler or any separately installed runtime.

matches:
  - trigger: ":calc_demo"
    replace: |
      @dialog: Демонстрационный калькулятор
      {{calculator_result}}

    vars:
      - name: calculator_inputs
        type: form
        params:
          layout: |
            Демонстрационная форма rEspanso

            Возраст: [[age]]
            Категория: [[category]]
            Фактор A: [[factor_a]]

            Это визуальный пример, не клиническая шкала.
          fields:
            age:
              type: text
              default: "50"
            category:
              type: choice
              values:
                - "Категория 1"
                - "Категория 2"
              default: "Категория 1"
            factor_a:
              type: choice
              values:
                - "Нет"
                - "Да"
              default: "Нет"

      - name: calculator_result
        type: rhai
        depends_on:
          - calculator_inputs
        params:
          path: "%CONFIG%/medical-calculators/modules/ui-demo.rhai"
          function: "calculate"
          input: "calculator_inputs"
