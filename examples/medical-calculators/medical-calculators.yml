# rEspanso clinical calculators.
#
# Each match opens an Espanso form, passes its string values to an embedded Rhai
# module and shows the calculated result in an informational dialog. Clinical
# equations remain editable and auditable outside the rEspanso core.

matches:
  - trigger: ":score2"
    replace: |
      @dialog: SCORE2 — сердечно-сосудистый риск
      {{score2_result}}
    vars:
      - name: score2_inputs
        type: form
        params:
          layout: |
            SCORE2: 10-летний риск фатального и нефатального СС-события

            Возраст (40–69 лет): [[age]]
            Пол: [[sex]]
            Регион риска: [[region]]
            Текущее курение: [[current_smoker]]
            САД, мм рт. ст.: [[sbp]]
            Общий холестерин, ммоль/л: [[total_cholesterol]]
            ХС-ЛПВП, ммоль/л: [[hdl_cholesterol]]

            Документированное ССЗ: [[established_cvd]]
            Сахарный диабет: [[diabetes]]
            СГХС / умеренная-тяжёлая ХБП / иное заведомо высокорисковое состояние: [[special_high_risk]]
          fields:
            age:
              type: text
              default: "55"
            sex:
              type: choice
              values: ["Мужчина", "Женщина"]
              default: "Мужчина"
            region:
              type: choice
              values:
                - "Низкий риск"
                - "Умеренный риск"
                - "Высокий риск"
                - "Очень высокий риск (Россия)"
              default: "Очень высокий риск (Россия)"
            current_smoker:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            sbp:
              type: text
              default: "140"
            total_cholesterol:
              type: text
              default: "5,5"
            hdl_cholesterol:
              type: text
              default: "1,3"
            established_cvd:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            diabetes:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            special_high_risk:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
      - name: score2_result
        type: rhai
        depends_on: [score2_inputs]
        params:
          path: "%CONFIG%/medical-calculators/modules/score2.rhai"
          function: "calculate"
          input: "score2_inputs"

  - trigger: ":score2op"
    replace: |
      @dialog: SCORE2-OP — сердечно-сосудистый риск
      {{score2op_result}}
    vars:
      - name: score2op_inputs
        type: form
        params:
          layout: |
            SCORE2-OP: 10-летний риск фатального и нефатального СС-события

            Возраст (70–89 лет): [[age]]
            Пол: [[sex]]
            Регион риска: [[region]]
            Текущее курение: [[current_smoker]]
            Сахарный диабет: [[diabetes]]
            САД, мм рт. ст.: [[sbp]]
            Общий холестерин, ммоль/л: [[total_cholesterol]]
            ХС-ЛПВП, ммоль/л: [[hdl_cholesterol]]

            Документированное ССЗ: [[established_cvd]]
            СГХС / умеренная-тяжёлая ХБП / иное заведомо высокорисковое состояние: [[special_high_risk]]
          fields:
            age:
              type: text
              default: "75"
            sex:
              type: choice
              values: ["Мужчина", "Женщина"]
              default: "Мужчина"
            region:
              type: choice
              values:
                - "Низкий риск"
                - "Умеренный риск"
                - "Высокий риск"
                - "Очень высокий риск (Россия)"
              default: "Очень высокий риск (Россия)"
            current_smoker:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            diabetes:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            sbp:
              type: text
              default: "150"
            total_cholesterol:
              type: text
              default: "6,0"
            hdl_cholesterol:
              type: text
              default: "1,4"
            established_cvd:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            special_high_risk:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
      - name: score2op_result
        type: rhai
        depends_on: [score2op_inputs]
        params:
          path: "%CONFIG%/medical-calculators/modules/score2-op.rhai"
          function: "calculate"
          input: "score2op_inputs"

  - trigger: ":hasbled"
    replace: |
      @dialog: HAS-BLED — факторы риска кровотечения
      {{hasbled_result}}
    vars:
      - name: hasbled_inputs
        type: form
        params:
          layout: |
            HAS-BLED

            Возраст: [[age]]
            Неконтролируемая АГ, САД >160 мм рт. ст.: [[hypertension]]
            Нарушение функции почек: [[renal]]
            Нарушение функции печени: [[liver]]
            Инсульт в анамнезе: [[stroke]]
            Кровотечение или предрасположенность: [[bleeding]]
            Лабильное МНО / TTR <60% при АВК: [[labile_inr]]
            Антиагрегант или НПВП: [[drugs]]
            Чрезмерное употребление алкоголя: [[alcohol]]
          fields:
            age:
              type: text
              default: "70"
            hypertension:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            renal:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            liver:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            stroke:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            bleeding:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            labile_inr:
              type: choice
              values: ["Нет / не применимо", "Да"]
              default: "Нет / не применимо"
            drugs:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            alcohol:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
      - name: hasbled_result
        type: rhai
        depends_on: [hasbled_inputs]
        params:
          path: "%CONFIG%/medical-calculators/modules/has-bled.rhai"
          function: "calculate"
          input: "hasbled_inputs"

  - trigger: ":cha2vasc"
    replace: |
      @dialog: CHA₂DS₂-VASc / CHA₂DS₂-VA
      {{cha2ds2_result}}
    vars:
      - name: cha2ds2_inputs
        type: form
        params:
          layout: |
            Риск тромбоэмболии при подтверждённой клинической ФП

            Возраст: [[age]]
            Пол: [[sex]]
            Сердечная недостаточность: [[heart_failure]]
            Артериальная гипертензия: [[hypertension]]
            Сахарный диабет: [[diabetes]]
            Инсульт / ТИА / артериальная эмболия в анамнезе: [[prior_stroke]]
            Сосудистое заболевание: [[vascular_disease]]
          fields:
            age:
              type: text
              default: "70"
            sex:
              type: choice
              values: ["Мужчина", "Женщина"]
              default: "Мужчина"
            heart_failure:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            hypertension:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            diabetes:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            prior_stroke:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            vascular_disease:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
      - name: cha2ds2_result
        type: rhai
        depends_on: [cha2ds2_inputs]
        params:
          path: "%CONFIG%/medical-calculators/modules/cha2ds2-vasc.rhai"
          function: "calculate"
          input: "cha2ds2_inputs"

  - trigger: ":findrisc"
    replace: |
      @dialog: FINDRISC — риск сахарного диабета 2 типа
      {{findrisc_result}}
    vars:
      - name: findrisc_inputs
        type: form
        params:
          layout: |
            FINDRISC: неинвазивная оценка 10-летнего риска СД 2 типа

            Возраст: [[age]]
            Пол: [[sex]]
            Масса тела, кг: [[weight]]
            Рост, см: [[height]]
            Окружность талии, см: [[waist]]
            Физическая активность ≥30 мин/день: [[physical_activity]]
            Овощи, фрукты или ягоды ежедневно: [[daily_vegetables]]
            Приём антигипертензивных препаратов: [[bp_medication]]
            Повышенная глюкоза когда-либо: [[high_glucose]]
            Семейный анамнез СД: [[family_history]]
          fields:
            age:
              type: text
              default: "50"
            sex:
              type: choice
              values: ["Мужчина", "Женщина"]
              default: "Мужчина"
            weight:
              type: text
              default: "80"
            height:
              type: text
              default: "175"
            waist:
              type: text
              default: "94"
            physical_activity:
              type: choice
              values: ["Да", "Нет"]
              default: "Да"
            daily_vegetables:
              type: choice
              values: ["Да", "Нет"]
              default: "Да"
            bp_medication:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            high_glucose:
              type: choice
              values: ["Нет", "Да"]
              default: "Нет"
            family_history:
              type: choice
              values:
                - "Нет"
                - "Только родственники 2-й степени"
                - "Родители, брат/сестра или ребёнок"
              default: "Нет"
      - name: findrisc_result
        type: rhai
        depends_on: [findrisc_inputs]
        params:
          path: "%CONFIG%/medical-calculators/modules/findrisc.rhai"
          function: "calculate"
          input: "findrisc_inputs"
